<section aria-labelledby="ev-title" style="font-family:Inter,ui-sans-serif,system-ui;background:#f6f3ec;color:#22263a;padding:32px;max-width:1120px;margin:auto">
  <h1 id="ev-title" style="font:700 32px Georgia,serif;margin:0 0 8px">Every instruction has to earn its place</h1>
  <p style="margin:0 0 24px;color:#536079">Frozen tasks first. Mandatory outcomes first. Efficiency only at outcome parity.</p>
  <svg viewBox="0 0 1060 650" role="img" aria-labelledby="ev-title ev-desc" style="width:100%;height:auto">
    <desc id="ev-desc">A results loop starts by fixing representative work briefs, success measures, review rules and fingerprints. Four randomized versions run: current Conductor, neutral brief, Claude-ready brief and OpenAI-ready brief. An independent reviewer judges mandatory outcomes and proof without model identity. Failed mandatory outcomes are rejected. Passing versions are compared on time, token categories, tool calls, interventions, unnecessary stops and consistency. A guidance test changes one instruction at a time. An instruction stays only if it produces repeatable gain or protects a rule machinery cannot enforce; otherwise it is removed. Results update versioned model guidance, never the fixed task.</desc>
    <defs><marker id="ea" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#59657d"/></marker></defs>
    <g fill="#fff" stroke="#aab2c0" stroke-width="1.5">
      <rect x="40" y="55" width="250" height="120" rx="14"/><rect x="350" y="55" width="660" height="120" rx="14"/>
      <rect x="40" y="240" width="285" height="150" rx="14" stroke="#d45e35" stroke-width="2"/><rect x="385" y="240" width="285" height="150" rx="14"/><rect x="730" y="240" width="280" height="150" rx="14"/>
      <rect x="190" y="465" width="300" height="115" rx="14" fill="#303548" stroke="#303548"/><rect x="570" y="465" width="300" height="115" rx="14"/>
    </g>
    <g font-family="Inter,system-ui" fill="#22263a">
      <text x="62" y="87" font-size="18" font-weight="700">1 &middot; FIX BEFORE RESULTS</text><text x="62" y="116" font-size="14">work briefs &middot; success targets</text><text x="62" y="139" font-size="14">review rules &middot; run count &middot; exclusions</text><text x="62" y="162" font-size="12" fill="#536079">fingerprints prove the test did not move</text>
      <text x="372" y="87" font-size="18" font-weight="700">2 &middot; RANDOMIZED MATCHED RUNS</text><text x="372" y="119" font-size="14">A &mdash; current Conductor</text><text x="535" y="119" font-size="14">B &mdash; neutral brief</text><text x="700" y="119" font-size="14">C &mdash; Claude-ready</text><text x="862" y="119" font-size="14">D &mdash; OpenAI-ready</text><text x="372" y="151" font-size="12" fill="#536079">same work brief &middot; model ID and effort recorded &middot; repeat where access permits</text>
      <text x="62" y="273" font-size="18" font-weight="700">3 &middot; INDEPENDENT RESULT CHECK</text><text x="62" y="305" font-size="14">Reviewer sees output + proof + review rules.</text><text x="62" y="330" font-size="14">Model, guidance, effort and prompt hidden.</text><text x="62" y="361" font-size="14" font-weight="700" fill="#b34725">Any mandatory regression &rarr; do not adopt.</text>
      <text x="407" y="273" font-size="18" font-weight="700">4 &middot; EFFICIENCY AT PARITY</text><text x="407" y="305" font-size="14">elapsed time &middot; input/cache/reasoning/output</text><text x="407" y="330" font-size="14">tool calls &middot; interventions &middot; avoidable stops</text><text x="407" y="355" font-size="14">unnecessary files &middot; repeat-run variance</text>
      <text x="752" y="273" font-size="18" font-weight="700">5 &middot; TEST ONE INSTRUCTION</text><text x="752" y="305" font-size="14">Add or remove one guidance rule.</text><text x="752" y="330" font-size="14">Re-run the same fixed task set.</text><text x="752" y="355" font-size="14">Keep what helps; remove folklore.</text>
      <text x="340" y="500" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">KEEP</text><text x="340" y="530" text-anchor="middle" font-size="14" fill="#fff">repeatable outcome/efficiency gain</text><text x="340" y="553" text-anchor="middle" font-size="14" fill="#fff">or an unenforceable invariant</text>
      <text x="720" y="500" text-anchor="middle" font-size="18" font-weight="700">REMOVE OR RETRIEVE</text><text x="720" y="530" text-anchor="middle" font-size="14">no gain &rarr; delete</text><text x="720" y="553" text-anchor="middle" font-size="14">task-specific &rarr; load only when needed</text>
    </g>
    <g stroke="#59657d" stroke-width="2" fill="none" marker-end="url(#ea)"><path d="M290 115 H340"/><path d="M680 175 V215 H182 V230"/><path d="M325 315 H375"/><path d="M670 315 H720"/><path d="M870 390 V430 H720 V455"/><path d="M730 580 V615 H920 V190 H985" stroke-dasharray="7 6"/><path d="M730 390 V430 H340 V455"/></g>
    <text x="793" y="612" font-family="Inter,system-ui" font-size="12" fill="#536079">versioned guidance learns; past tasks do not change</text>
  </svg>
</section>
