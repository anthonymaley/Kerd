<section aria-labelledby="te-title" style="font-family:Inter,ui-sans-serif,system-ui;background:#f6f3ec;color:#22263a;padding:32px;max-width:1080px;margin:auto">
  <h1 id="te-title" style="font:700 32px Georgia,serif;margin:0 0 8px">The work brief: precise about the job, quiet about the path</h1>
  <p style="margin:0 0 26px;color:#536079">The stable interface between producer intent, model-specific compilation, and evaluation.</p>
  <svg viewBox="0 0 1020 690" role="img" aria-labelledby="te-title te-desc" style="width:100%;height:auto">
    <desc id="te-desc">The work brief has nine fields arranged around a stable core. Outcome, deliverable, success measures, proof, context, boundaries, decision rights, open questions and done condition feed a central requirement fingerprint. Success defines what winning changes; proof makes it reviewable; boundaries define prohibited effects; the done condition defines when to stop. A boundary below lists what does not belong in the brief: provider syntax, generic reasoning instructions, hard-coded tool order, copied tool schemas and historical anti-laziness rules.</desc>
    <g fill="#fff" stroke="#aab2c0" stroke-width="1.4">
      <rect x="35" y="55" width="285" height="105" rx="13"/><rect x="368" y="55" width="285" height="105" rx="13"/><rect x="700" y="55" width="285" height="105" rx="13"/>
      <rect x="35" y="205" width="285" height="105" rx="13"/><rect x="368" y="205" width="285" height="105" rx="13"/><rect x="700" y="205" width="285" height="105" rx="13"/>
      <rect x="35" y="355" width="285" height="105" rx="13"/><rect x="368" y="355" width="285" height="105" rx="13"/><rect x="700" y="355" width="285" height="105" rx="13"/>
      <rect x="305" y="505" width="410" height="80" rx="16" fill="#303548" stroke="#303548"/>
      <rect x="125" y="625" width="770" height="44" rx="10" fill="#f3dfd6" stroke="#d45e35"/>
    </g>
    <g font-family="Inter,system-ui" fill="#22263a">
      <text x="55" y="85" font-size="17" font-weight="700">OBJECTIVE</text><text x="55" y="113" font-size="14">What change is wanted?</text><text x="55" y="138" font-size="12" fill="#536079">one outcome, not activity</text>
      <text x="388" y="85" font-size="17" font-weight="700">DELIVERABLE</text><text x="388" y="113" font-size="14">What must exist afterward?</text><text x="388" y="138" font-size="12" fill="#536079">observable nouns</text>
      <text x="720" y="85" font-size="17" font-weight="700">SUCCESS</text><text x="720" y="113" font-size="14">What changes, target, method?</text><text x="720" y="138" font-size="12" fill="#536079">frozen before the run</text>
      <text x="55" y="235" font-size="17" font-weight="700">EVIDENCE</text><text x="55" y="263" font-size="14">What proves each success row?</text><text x="55" y="288" font-size="12" fill="#536079">resolving, reviewable artifacts</text>
      <text x="388" y="235" font-size="17" font-weight="700">CONTEXT</text><text x="388" y="263" font-size="14">What must be loaded now or on demand?</text><text x="388" y="288" font-size="12" fill="#536079">paths + provenance, not a dump</text>
      <text x="720" y="235" font-size="17" font-weight="700">GUARDRAILS</text><text x="720" y="263" font-size="14">What effects are prohibited?</text><text x="720" y="288" font-size="12" fill="#536079">real invariants, not preferences</text>
      <text x="55" y="385" font-size="17" font-weight="700">AUTHORITY</text><text x="55" y="413" font-size="14">What may the model decide or change?</text><text x="55" y="438" font-size="12" fill="#536079">producer-owned decisions named</text>
      <text x="388" y="385" font-size="17" font-weight="700">UNKNOWNS</text><text x="388" y="413" font-size="14">What must be measured or clarified?</text><text x="388" y="438" font-size="12" fill="#536079">never permission to invent</text>
      <text x="720" y="385" font-size="17" font-weight="700">COMPLETION</text><text x="720" y="413" font-size="14">When should the executor stop?</text><text x="720" y="438" font-size="12" fill="#536079">proof, blocker, or named boundary</text>
      <text x="510" y="538" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">FIXED REQUIREMENT FINGERPRINT</text><text x="510" y="565" text-anchor="middle" font-size="13" fill="#dfe4ef">the same test shared by every model and model-ready brief</text>
      <text x="510" y="653" text-anchor="middle" font-size="13" font-weight="700" fill="#9e3e20">OUT: provider syntax &middot; generic reasoning scripts &middot; copied tool schemas &middot; hard-coded method</text>
    </g>
  </svg>
</section>
