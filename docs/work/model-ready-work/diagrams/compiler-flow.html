<section aria-labelledby="title" style="font-family:Inter,ui-sans-serif,system-ui;background:#f6f3ec;color:#22263a;padding:32px;max-width:1120px;margin:auto">
  <h1 id="title" style="font:700 32px Georgia,serif;margin:0 0 8px">Conductor prepares the work for each model</h1>
  <p style="margin:0 0 28px;color:#536079">One stable contract, model-native execution prompts, one unchanged exam.</p>
  <svg viewBox="0 0 1060 650" role="img" aria-labelledby="title desc" style="width:100%;height:auto">
    <desc id="desc">A stable work brief enters Conductor assessment. Conductor considers capability, consequence, complexity, speed, proof and familiarity, then chooses a model and effort. Versioned guidance prepares a prompt for Claude, OpenAI, or the neutral baseline. A coverage check verifies every outcome, measure, proof obligation, boundary, decision right and done condition. The model chooses its method. Results return to the unchanged success measures for independent review. Results update model guidance but never rewrite the requirement after the run.</desc>
    <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#59657d"/></marker></defs>
    <g fill="#fff" stroke="#aab2c0" stroke-width="1.5">
      <rect x="35" y="50" width="210" height="150" rx="14"/><rect x="305" y="50" width="210" height="150" rx="14"/>
      <rect x="575" y="50" width="210" height="150" rx="14"/><rect x="845" y="50" width="180" height="150" rx="14"/>
      <rect x="305" y="280" width="480" height="105" rx="14" stroke="#d45e35" stroke-width="2"/>
      <rect x="150" y="460" width="275" height="125" rx="14"/><rect x="635" y="460" width="275" height="125" rx="14"/>
    </g>
    <g font-family="Inter,system-ui" fill="#22263a">
      <text x="55" y="82" font-weight="700" font-size="17">1 &middot; CANONICAL ENVELOPE</text><text x="55" y="110" font-size="14">objective &middot; deliverable &middot; success</text><text x="55" y="133" font-size="14">evidence &middot; context &middot; guardrails</text><text x="55" y="156" font-size="14">authority &middot; unknowns &middot; completion</text><text x="55" y="184" font-size="12" fill="#536079">frozen digest &mdash; provider neutral</text>
      <text x="325" y="82" font-weight="700" font-size="17">2 &middot; ASSESS</text><text x="325" y="110" font-size="14">capability &middot; consequence</text><text x="325" y="133" font-size="14">complexity &middot; latency &middot; evidence</text><text x="325" y="156" font-size="14">familiarity with tested profiles</text><text x="325" y="184" font-size="12" fill="#536079">visible premise, not prestige</text>
      <text x="595" y="82" font-weight="700" font-size="17">3 &middot; CHOOSE</text><text x="595" y="110" font-size="14">provider + model family</text><text x="595" y="133" font-size="14">effort + freedom level</text><text x="595" y="156" font-size="14">guidance version + reason</text><text x="595" y="184" font-size="12" fill="#536079">actual pair confirmed</text>
      <text x="865" y="82" font-weight="700" font-size="17">4 &middot; COMPILE</text><text x="865" y="110" font-size="14">Claude profile</text><text x="865" y="133" font-size="14">OpenAI profile</text><text x="865" y="156" font-size="14">neutral baseline</text><text x="865" y="184" font-size="12" fill="#536079">only applicable clauses</text>
      <text x="330" y="312" font-weight="700" font-size="18">PRESERVATION GATE &mdash; before execution</text><text x="330" y="341" font-size="14">Manifest maps every requirement obligation to prompt or machine surface.</text><text x="330" y="365" font-size="14" font-weight="700" fill="#b34725">A model-specific optimization may change expression, never meaning.</text>
      <text x="175" y="493" font-weight="700" font-size="18">5 &middot; LET THE MODEL COOK</text><text x="175" y="523" font-size="14">Executor chooses method and tool order.</text><text x="175" y="547" font-size="14">Prescribe steps only when order is correctness.</text><text x="175" y="572" font-size="12" fill="#536079">freedom inside outcome + authority bounds</text>
      <text x="660" y="493" font-weight="700" font-size="18">6 &middot; JUDGE THE SAME RESULT</text><text x="660" y="523" font-size="14">Independent review against fixed measures.</text><text x="660" y="547" font-size="14">Then compare time, tokens, stops and consistency.</text><text x="660" y="572" font-size="12" fill="#536079">results improve guidance &mdash; never the past task</text>
    </g>
    <g stroke="#59657d" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M245 125 H295"/><path d="M515 125 H565"/><path d="M785 125 H835"/><path d="M935 200 V250 H545 V270"/><path d="M545 385 V420 H287 V450"/><path d="M425 522 H625"/><path d="M772 460 V420 H940 V210" stroke-dasharray="7 6"/></g>
    <text x="790" y="416" font-family="Inter,system-ui" font-size="12" fill="#536079">measured clauses survive</text>
  </svg>
</section>
