<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The unattended Claude build</title>
<style>
  :root {
    --paper: #F7F9F7;
    --paper-2: #EDF0EE;
    --ink: #0B1512;
    --muted: #4E5D58;
    --rule: #D5DCD7;
    --accent: #0B5E4A;
    --accent-tint: #F7F9F7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #121B17;
      --paper-2: #0B1310;
      --ink: #E5EBE7;
      --muted: #93A29B;
      --rule: #223029;
      --accent: #5CC5A3;
      --accent-tint: #121B17;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper-2);
    color: var(--ink);
    font-family: -apple-system, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Inter, system-ui, "Segoe UI", Roboto, sans-serif;
  }
  .wrap {
    max-width: 1280px;
    margin: 0 auto;
    padding: 48px 32px 64px;
  }
  .eyebrow {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin: 0 0 8px;
  }
  h1 {
    font-size: clamp(28px, 3.4vw, 40px);
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin: 0 0 12px;
    font-weight: 600;
  }
  .lead {
    font-size: 17px;
    line-height: 1.5;
    color: var(--muted);
    max-width: 46rem;
    margin: 0 0 32px;
  }
  .frame {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 24px;
  }
  svg text { font-family: -apple-system, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Inter, system-ui, "Segoe UI", Roboto, sans-serif; }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Kerd · unattended build</p>
  <h1>The unattended Claude build</h1>
  <p class="lead">Three lanes of Claude work run in parallel on their own branch while you are away. Codex reviews once at the end. Nothing merges or pushes without you.</p>
  <div class="frame">
    <svg viewBox="0 0 1280 400" role="img" aria-labelledby="plan-title plan-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="plan-title">The unattended Claude build</title>
      <desc id="plan-desc">Three Claude lanes (fixes, evidence runs, drafts for Anthony) and one small Codex review run on their own branch in batches, the chat rolling itself between batches, and stop before merge for Anthony's go.</desc>
      <rect width="1280" height="400" fill="var(--paper)"/>
<g><rect x="32" y="0" width="280" height="240" fill="var(--paper)" stroke="var(--rule)" stroke-width="1"/>
<text x="52" y="32" font-size="15" font-weight="600" fill="var(--ink)">Fixes</text>
<text x="52" y="50" font-size="11" fill="var(--muted)">Claude players, tests with each</text>
<line x1="52" y1="62" x2="292" y2="62" stroke="var(--rule)" stroke-width="1"/><text x="52" y="84" font-size="12" fill="var(--ink)">A flaky Conductor test</text>
<text x="52" y="100" font-size="12" fill="var(--ink)">made steady</text>
<text x="52" y="124" font-size="12" fill="var(--ink)">Switch Out refuses its saved</text>
<text x="52" y="140" font-size="12" fill="var(--ink)">box when the commit is not</text>
<text x="52" y="156" font-size="12" fill="var(--ink)">on the remote</text>
<text x="52" y="180" font-size="12" fill="var(--ink)">The playbook stops repeating</text>
<text x="52" y="196" font-size="12" fill="var(--ink)">CONTEXT.md</text>
</g>
<g><rect x="344" y="0" width="280" height="240" fill="var(--paper)" stroke="var(--rule)" stroke-width="1"/>
<text x="364" y="32" font-size="15" font-weight="600" fill="var(--ink)">Evidence runs</text>
<text x="364" y="50" font-size="11" fill="var(--muted)">Many fresh Claude sessions, scratch repos</text>
<line x1="364" y1="62" x2="604" y2="62" stroke="var(--rule)" stroke-width="1"/><text x="364" y="84" font-size="12" fill="var(--ink)">Each watched rule run 3+ times:</text>
<text x="364" y="100" font-size="12" fill="var(--ink)">a turn never ends idle, the</text>
<text x="364" y="116" font-size="12" fill="var(--ink)">report shape, the unanswered</text>
<text x="364" y="132" font-size="12" fill="var(--ink)">review, "Something else",</text>
<text x="364" y="148" font-size="12" fill="var(--ink)">the Opus 5.5 clauses</text>
<text x="364" y="172" font-size="12" fill="var(--ink)">A clear defect found gets a</text>
<text x="364" y="188" font-size="12" fill="var(--ink)">small tested fix; the rest</text>
<text x="364" y="204" font-size="12" fill="var(--ink)">is written up</text>
</g>
<g><rect x="656" y="0" width="280" height="240" fill="var(--paper)" stroke="var(--rule)" stroke-width="1"/>
<text x="676" y="32" font-size="15" font-weight="600" fill="var(--ink)">Drafts for you</text>
<text x="676" y="50" font-size="11" fill="var(--muted)">Opus composer, proposals only</text>
<line x1="676" y1="62" x2="916" y2="62" stroke="var(--rule)" stroke-width="1"/><text x="676" y="84" font-size="12" fill="var(--ink)">How a pickup proves it</text>
<text x="676" y="100" font-size="12" fill="var(--ink)">restored what the close saved</text>
<text x="676" y="124" font-size="12" fill="var(--ink)">Where PRs, links and decks</text>
<text x="676" y="140" font-size="12" fill="var(--ink)">live</text>
<text x="676" y="164" font-size="12" fill="var(--ink)">Whether a machine's own</text>
<text x="676" y="180" font-size="12" fill="var(--ink)">settings are Kerd's business</text>
</g>
<g><rect x="968" y="0" width="280" height="240" fill="var(--paper)" stroke="var(--rule)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="988" y="32" font-size="15" font-weight="600" fill="var(--ink)">Codex</text>
<text x="988" y="50" font-size="11" fill="var(--muted)">Essentials only, low tokens</text>
<line x1="988" y1="62" x2="1228" y2="62" stroke="var(--rule)" stroke-width="1"/><text x="988" y="84" font-size="12" fill="var(--ink)">One review before the stop,</text>
<text x="988" y="100" font-size="12" fill="var(--ink)">of the whole branch</text>
<text x="988" y="124" font-size="12" fill="var(--ink)">Nothing else</text>
</g>
<text x="32" y="284" font-size="11" fill="var(--muted)" letter-spacing="0.06em">HOW IT RUNS WHILE YOU ARE AWAY</text>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--muted)"/></marker></defs>
<line x1="228" y1="340" x2="256" y2="340" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="484" y1="340" x2="512" y2="340" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="740" y1="340" x2="768" y2="340" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="996" y1="340" x2="1024" y2="340" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
<g><rect x="32" y="308" width="196" height="64" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
<text x="130" y="336" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">Own branch</text>
<text x="130" y="354" font-size="10" fill="var(--muted)" text-anchor="middle">concert/unattended-sweep</text></g>
<g><rect x="256" y="308" width="228" height="64" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
<text x="370" y="336" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">Batches of players</text>
<text x="370" y="354" font-size="10" fill="var(--muted)" text-anchor="middle">all three lanes in parallel</text></g>
<g><rect x="512" y="308" width="228" height="64" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
<text x="626" y="336" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">Chat rolls itself</text>
<text x="626" y="354" font-size="10" fill="var(--muted)" text-anchor="middle">between batches, at most 3</text></g>
<g><rect x="768" y="308" width="228" height="64" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
<text x="882" y="336" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">Codex review</text>
<text x="882" y="354" font-size="10" fill="var(--muted)" text-anchor="middle">whole branch, once</text></g>
<g><rect x="1024" y="308" width="224" height="64" fill="var(--paper)" stroke="var(--accent)" stroke-width="1.6"/>
<text x="1136" y="336" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">Stops for your go</text>
<text x="1136" y="354" font-size="10" fill="var(--muted)" text-anchor="middle">0.156.0 ready, not merged</text></g>

    </svg>
  </div>
</div>
</body>
</html>
