<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>What the next Kerd release builds</title>
<style>
  :root {
    --paper: #F7F9F7;
    --paper-2: #EDF0EE;
    --ink: #0B1512;
    --muted: #4E5D58;
    --rule: #D5DCD7;
    --accent: #0B5E4A;
    --accent-tint: #F7F9F7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #121B17;
      --paper-2: #0B1310;
      --ink: #E5EBE7;
      --muted: #93A29B;
      --rule: #223029;
      --accent: #5CC5A3;
      --accent-tint: #121B17;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper-2);
    color: var(--ink);
    font-family: -apple-system, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Inter, system-ui, "Segoe UI", Roboto, sans-serif;
  }
  .wrap {
    max-width: 1280px;
    margin: 0 auto;
    padding: 48px 32px 64px;
  }
  .eyebrow {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin: 0 0 8px;
  }
  h1 {
    font-size: clamp(28px, 3.4vw, 40px);
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin: 0 0 12px;
    font-weight: 600;
  }
  .lead {
    font-size: 17px;
    line-height: 1.5;
    color: var(--muted);
    max-width: 46rem;
    margin: 0 0 32px;
  }
  .frame {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 24px;
  }
  svg text { font-family: -apple-system, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Inter, system-ui, "Segoe UI", Roboto, sans-serif; }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Release 0.155.0</p>
  <h1>What the next Kerd release builds</h1>
  <p class="lead">Four pieces of work, each with its own owner, moving through the same path to release.</p>
  <div class="frame">
    <svg viewBox="0 0 1280 512" role="img" aria-labelledby="build-title build-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="build-title">What the next Kerd release builds</title>
      <desc id="build-desc">Four workstreams for release 0.155.0 — agent security, a human-voice pass, small fixes, and a waiting-on-you bell — each shown with its owner and items, feeding one release flow from own branch through build, review, and go, to merge; with one dropped item and one untested assumption shown apart from the flow.</desc>

      <rect width="1280" height="512" fill="var(--paper)"/>

      <!-- ===== Four lane cards ===== -->
      <!-- Lane 1: Agent security -->
      <g>
        <rect x="32" y="0" width="280" height="220" rx="6" fill="var(--paper)" stroke="var(--rule)" stroke-width="1"/>
        <rect x="32" y="0" width="280" height="4" fill="var(--accent)"/>
        <text x="52" y="32" font-size="15" font-weight="600" fill="var(--ink)">Agent security</text>
        <text x="52" y="50" font-size="11" fill="var(--muted)">Owner: Claude builds, Codex reviews</text>
        <line x1="52" y1="62" x2="292" y2="62" stroke="var(--rule)" stroke-width="1"/>
        <text x="52" y="84" font-size="12" fill="var(--ink)">Partner messages no longer</text>
        <text x="52" y="99" font-size="12" fill="var(--ink)">readable by other accounts</text>
        <text x="52" y="121" font-size="12" fill="var(--ink)">Checks it's talking to the</text>
        <text x="52" y="136" font-size="12" fill="var(--ink)">right Claude session</text>
        <text x="52" y="158" font-size="12" fill="var(--ink)">Notices a partner's log</text>
        <text x="52" y="173" font-size="12" fill="var(--ink)">rewritten in place</text>
        <text x="52" y="195" font-size="12" fill="var(--ink)">Each Kerd sender gets its</text>
        <text x="52" y="210" font-size="12" fill="var(--ink)">own rate limit</text>
      </g>

      <!-- Lane 2: Human-voice pass -->
      <g>
        <rect x="344" y="0" width="280" height="220" rx="6" fill="var(--paper)" stroke="var(--rule)" stroke-width="1"/>
        <text x="364" y="32" font-size="15" font-weight="600" fill="var(--ink)">Human-voice pass</text>
        <text x="364" y="50" font-size="11" fill="var(--muted)">Owner: Claude players</text>
        <line x1="364" y1="62" x2="604" y2="62" stroke="var(--rule)" stroke-width="1"/>
        <text x="364" y="84" font-size="12" fill="var(--ink)">Over what people read:</text>
        <text x="364" y="106" font-size="12" fill="var(--ink)">README intro, the guides,</text>
        <text x="364" y="121" font-size="12" fill="var(--ink)">the website, the release</text>
        <text x="364" y="136" font-size="12" fill="var(--ink)">history</text>
        <text x="364" y="158" font-size="12" fill="var(--ink)">Dashes out only — no</text>
        <text x="364" y="173" font-size="12" fill="var(--ink)">rewrite of the words</text>
      </g>

      <!-- Lane 3: Small fixes -->
      <g>
        <rect x="656" y="0" width="280" height="220" rx="6" fill="var(--paper)" stroke="var(--rule)" stroke-width="1"/>
        <text x="676" y="32" font-size="15" font-weight="600" fill="var(--ink)">Small fixes</text>
        <text x="676" y="50" font-size="11" fill="var(--muted)">Owner: Claude</text>
        <line x1="676" y1="62" x2="916" y2="62" stroke="var(--rule)" stroke-width="1"/>
        <text x="676" y="84" font-size="12" fill="var(--ink)">Vault rule wording</text>
        <text x="676" y="106" font-size="12" fill="var(--ink)">Release check that the</text>
        <text x="676" y="121" font-size="12" fill="var(--ink)">What's New version is right</text>
        <text x="676" y="143" font-size="12" fill="var(--ink)">Kerd's Obsidian vault</text>
        <text x="676" y="158" font-size="12" fill="var(--ink)">brought up to date</text>
      </g>

      <!-- Lane 4: Waiting on you -->
      <g>
        <rect x="968" y="0" width="280" height="220" rx="6" fill="var(--paper)" stroke="var(--rule)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="988" y="32" font-size="15" font-weight="600" fill="var(--ink)">Which session is waiting</text>
        <text x="988" y="48" font-size="15" font-weight="600" fill="var(--ink)">on you</text>
        <text x="988" y="66" font-size="11" fill="var(--muted)">Owner: Anthony's machine</text>
        <text x="988" y="80" font-size="11" fill="var(--muted)">settings — no Kerd code</text>
        <line x1="988" y1="92" x2="1228" y2="92" stroke="var(--rule)" stroke-width="1"/>
        <text x="988" y="114" font-size="12" fill="var(--ink)">A bell on the laptop tab</text>
        <text x="988" y="129" font-size="12" fill="var(--ink)">when Claude or Codex stops</text>
        <text x="988" y="151" font-size="12" fill="var(--ink)">Two settings on the Studio</text>
        <text x="988" y="173" font-size="12" fill="var(--ink)">Anthony tests the bell first</text>
      </g>

      <!-- ===== Release flow ===== -->
      <text x="32" y="264" font-size="11" fill="var(--muted)" letter-spacing="0.06em">HOW EACH PIECE REACHES A RELEASE</text>

      <!-- connectors first -->
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="var(--muted)"/>
        </marker>
      </defs>
      <line x1="228" y1="320" x2="256" y2="320" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="484" y1="320" x2="512" y2="320" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="740" y1="320" x2="768" y2="320" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="996" y1="320" x2="1024" y2="320" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- flow boxes -->
      <g>
        <rect x="32" y="288" width="196" height="64" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
        <text x="130" y="316" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">Own branch</text>
        <text x="130" y="334" font-size="10" fill="var(--muted)" text-anchor="middle">concert/backlog-sweep</text>
      </g>
      <g>
        <rect x="256" y="288" width="228" height="64" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
        <text x="370" y="316" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">Build and checks</text>
        <text x="370" y="334" font-size="10" fill="var(--muted)" text-anchor="middle">tests, release check</text>
      </g>
      <g>
        <rect x="512" y="288" width="228" height="64" rx="6" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.2"/>
        <text x="626" y="316" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">Codex review</text>
        <text x="626" y="334" font-size="10" fill="var(--muted)" text-anchor="middle">before push</text>
      </g>
      <g>
        <rect x="768" y="288" width="228" height="64" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
        <text x="882" y="316" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">Anthony's go</text>
        <text x="882" y="334" font-size="10" fill="var(--muted)" text-anchor="middle">final say to merge</text>
      </g>
      <g>
        <rect x="1024" y="288" width="224" height="64" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1"/>
        <text x="1136" y="312" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">Merge, release</text>
        <text x="1136" y="328" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">0.155.0</text>
      </g>

      <!-- ===== Set apart: dropped item and untested assumption ===== -->
      <line x1="32" y1="400" x2="1248" y2="400" stroke="var(--rule)" stroke-width="1"/>
      <text x="32" y="424" font-size="11" fill="var(--muted)" letter-spacing="0.06em">SET APART — NOT IN THE FLOW ABOVE</text>

      <g opacity="0.55">
        <rect x="32" y="440" width="608" height="56" rx="6" fill="var(--paper)" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="52" y="464" font-size="12" font-weight="600" fill="var(--muted)">Dropped</text>
        <text x="52" y="482" font-size="12" fill="var(--muted)">CI check for single definitions — too fuzzy</text>
      </g>

      <g opacity="0.75">
        <rect x="672" y="440" width="576" height="56" rx="6" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1" stroke-dasharray="4,4"/>
        <text x="692" y="464" font-size="12" font-weight="600" fill="var(--accent)">Untested assumption</text>
        <text x="692" y="482" font-size="12" fill="var(--ink)">Partners can read the message file — checked live before release</text>
      </g>

    </svg>
  </div>
</div>
</body>
</html>
