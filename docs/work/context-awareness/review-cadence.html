<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>When Codex reviews the build · Swimlane</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #FAFAFA;
      --color-ink:     #181818;
      --color-muted:   #4A4F57;
      --color-accent:  #1A6FFF;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub { color: var(--color-muted); font-size: 0.95rem; margin-bottom: 1.5rem; }
    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · Review cadence for codex-tui</p>
    <h1>When Codex reviews the context-aware Roll build</h1>
    <p class="sub">Each lane is one cadence choice. A cadence only schedules Codex's reviews; commit, push and release still need Anthony's go.</p>

    <div class="scroll">
    <svg viewBox="0 0 1072 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="review-cadence-title review-cadence-desc">
      <title id="review-cadence-title">When Codex reviews the context-aware Roll build</title>
      <desc id="review-cadence-desc">Comparison of four review cadences plus the recommended checkpoints and before-push combination, showing where a Codex review happens along the build from plan to done.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4A4F57"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#FAFAFA"/>

      <!-- Needs-Anthony bracket over commit/push and release -->
      <line x1="672" y1="36" x2="888" y2="36" stroke="#4A4F57" stroke-width="1"/>
      <line x1="672" y1="36" x2="672" y2="44" stroke="#4A4F57" stroke-width="1"/>
      <line x1="888" y1="36" x2="888" y2="44" stroke="#4A4F57" stroke-width="1"/>
      <rect x="712" y="20" width="136" height="12" rx="2" fill="#FAFAFA"/>
      <text x="780" y="28" fill="#4A4F57" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NEEDS ANTHONY'S GO</text>

      <!-- Build sequence arrows (drawn before boxes) -->
      <line x1="288" y1="64" x2="308" y2="64" stroke="#4A4F57" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="408" y1="64" x2="428" y2="64" stroke="#4A4F57" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="528" y1="64" x2="548" y2="64" stroke="#4A4F57" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="648" y1="64" x2="668" y2="64" stroke="#4A4F57" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="768" y1="64" x2="788" y2="64" stroke="#4A4F57" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="888" y1="64" x2="908" y2="64" stroke="#4A4F57" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Column guides through the lanes -->
      <g stroke="rgba(45,49,66,0.06)" stroke-width="1">
        <line x1="240" y1="104" x2="240" y2="424"/>
        <line x1="360" y1="104" x2="360" y2="424"/>
        <line x1="480" y1="104" x2="480" y2="424"/>
        <line x1="600" y1="104" x2="600" y2="424"/>
        <line x1="720" y1="104" x2="720" y2="424"/>
        <line x1="840" y1="104" x2="840" y2="424"/>
        <line x1="960" y1="104" x2="960" y2="424"/>
      </g>

      <!-- Build stage boxes -->
      <g font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">
        <rect x="192" y="48" width="96" height="32" rx="6" fill="#FFFFFF" stroke="#181818" stroke-width="1"/>
        <text x="240" y="68" fill="#181818">plan</text>
        <rect x="312" y="48" width="96" height="32" rx="6" fill="#FFFFFF" stroke="#181818" stroke-width="1"/>
        <text x="360" y="68" fill="#181818">adapter code</text>
        <rect x="432" y="48" width="96" height="32" rx="6" fill="#FFFFFF" stroke="#181818" stroke-width="1"/>
        <text x="480" y="68" fill="#181818">tests</text>
        <rect x="552" y="48" width="96" height="32" rx="6" fill="#FFFFFF" stroke="#181818" stroke-width="1"/>
        <text x="600" y="68" fill="#181818">docs</text>
        <rect x="672" y="48" width="96" height="32" rx="6" fill="rgba(24,24,24,0.03)" stroke="rgba(24,24,24,0.30)" stroke-width="1"/>
        <text x="720" y="68" fill="#181818">commit / push</text>
        <rect x="792" y="48" width="96" height="32" rx="6" fill="rgba(24,24,24,0.03)" stroke="rgba(24,24,24,0.30)" stroke-width="1"/>
        <text x="840" y="68" fill="#181818">release</text>
        <rect x="912" y="48" width="96" height="32" rx="6" fill="#FFFFFF" stroke="#181818" stroke-width="1"/>
        <text x="960" y="68" fill="#181818">done</text>
      </g>

      <!-- Lane bands and dividers -->
      <rect x="24" y="360" width="1024" height="64" fill="rgba(26,111,255,0.05)"/>
      <line x1="24" y1="104" x2="1048" y2="104" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="24" y1="168" x2="1048" y2="168" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="24" y1="232" x2="1048" y2="232" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="24" y1="296" x2="1048" y2="296" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="24" y1="360" x2="1048" y2="360" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="24" y1="424" x2="1048" y2="424" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="168" y1="104" x2="168" y2="424" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

      <!-- Lane labels -->
      <g font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.18em" fill="#4A4F57">
        <text x="40" y="140">CHECKPOINTS</text>
        <text x="40" y="204">BEFORE-PUSH</text>
        <text x="40" y="268">END</text>
        <text x="40" y="332">ON-REQUEST</text>
        <text x="40" y="388" fill="#1A6FFF">RECOMMENDED</text>
      </g>
      <text x="40" y="404" fill="#4A4F57" font-size="8" font-family="'Geist Mono', monospace">checkpoints + before-push</text>

      <!-- Lane tracks -->
      <g stroke="#DEE1E6" stroke-width="1">
        <line x1="192" y1="136" x2="1048" y2="136"/>
        <line x1="192" y1="200" x2="1048" y2="200"/>
        <line x1="192" y1="264" x2="1048" y2="264"/>
        <line x1="192" y1="392" x2="1048" y2="392"/>
      </g>

      <!-- Review markers: checkpoints (after adapter code) -->
      <polygon points="420,128 428,136 420,144 412,136" fill="#FFFFFF" stroke="#181818" stroke-width="1.2"/>
      <rect x="392" y="148" width="56" height="12" rx="2" fill="#FAFAFA"/>
      <text x="420" y="156" fill="#4A4F57" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ADAPTER</text>

      <!-- before-push (after docs, before commit) -->
      <polygon points="660,192 668,200 660,208 652,200" fill="#FFFFFF" stroke="#181818" stroke-width="1.2"/>
      <rect x="624" y="212" width="72" height="12" rx="2" fill="#FAFAFA"/>
      <text x="660" y="220" fill="#4A4F57" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHANGE SET</text>

      <!-- end (once the work completes) -->
      <polygon points="1032,256 1040,264 1032,272 1024,264" fill="#FFFFFF" stroke="#181818" stroke-width="1.2"/>
      <rect x="1000" y="276" width="48" height="12" rx="2" fill="#FAFAFA"/>
      <text x="1024" y="284" fill="#4A4F57" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AT END</text>

      <!-- on-request: nothing automatic -->
      <text x="608" y="332" fill="#767D88" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">no automatic review · Codex looks only when you or Claude ask</text>

      <!-- recommended: adapter + change set -->
      <polygon points="420,384 428,392 420,400 412,392" fill="rgba(26,111,255,0.10)" stroke="#1A6FFF" stroke-width="1.4"/>
      <rect x="392" y="404" width="56" height="12" rx="2" fill="#EFF3FA"/>
      <text x="420" y="412" fill="#1A6FFF" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ADAPTER</text>
      <polygon points="660,384 668,392 660,400 652,392" fill="rgba(26,111,255,0.10)" stroke="#1A6FFF" stroke-width="1.4"/>
      <rect x="624" y="404" width="72" height="12" rx="2" fill="#EFF3FA"/>
      <text x="660" y="412" fill="#1A6FFF" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHANGE SET</text>

      <!-- Legend strip -->
      <line x1="24" y1="448" x2="1048" y2="448" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="476" fill="#4A4F57" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <polygon points="136,464 144,472 136,480 128,472" fill="#FFFFFF" stroke="#181818" stroke-width="1.2"/>
      <text x="156" y="476" fill="#4A4F57" font-size="12" font-family="'Geist', sans-serif">a Codex review happens here</text>
      <polygon points="388,464 396,472 388,480 380,472" fill="rgba(26,111,255,0.10)" stroke="#1A6FFF" stroke-width="1.4"/>
      <text x="408" y="476" fill="#4A4F57" font-size="12" font-family="'Geist', sans-serif">recommended reviews</text>
      <rect x="592" y="464" width="40" height="16" rx="4" fill="rgba(24,24,24,0.03)" stroke="rgba(24,24,24,0.30)" stroke-width="1"/>
      <text x="648" y="476" fill="#4A4F57" font-size="12" font-family="'Geist', sans-serif">steps only Anthony can approve; no cadence grants them</text>
    </svg>
    </div>
  </div>
</body>
</html>
