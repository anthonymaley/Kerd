<tspan x="678.0" dy="0.0">exempt list in kit: X - board says &#x27;never asked&#x27; about three done</tspan>
<tspan x="678.0" dy="15.0">journeys forever; a special case that only shrinks.</tspan>
<tspan x="678.0" dy="15.0">audit-only, no gate row: X - nothing refuses a new slice; the</tspan>
<tspan x="678.0" dy="15.0">forcing function loses its teeth.</tspan>
<tspan x="678.0" dy="15.0">honest retrofit: O - one falsifiable line each, landing in the</tspan>
<tspan x="678.0" dy="15.0">SAME COMMIT as the rule; no tip ever has one without the other.</tspan>
</text>
<text x="1320.0" y="907.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#2f9e44" text-anchor="start" xml:space="preserve">
