<tspan x="678.0" dy="0.0">line in ## Release slice: O - matches the keyed frame (&#x27;declared</tspan>
<tspan x="678.0" dy="15.0">in the Release slice definition&#x27;); nothing invented.</tspan>
<tspan x="678.0" dy="15.0">front-matter key: X - a third key breaks the route/stage</tspan>
<tspan x="678.0" dy="15.0">both-or-nothing pair.</tspan>
<tspan x="678.0" dy="15.0">new ## Rigor section: X - empty until slice 2; RESERVED as the</tspan>
<tspan x="678.0" dy="15.0">disposition table&#x27;s home, nothing built for it now.</tspan>
</text>
