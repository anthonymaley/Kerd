<svg xmlns="http://www.w3.org/2000/svg" width="1347" height="1070" viewBox="260 40 1347 1070">
<rect x="260" y="40" width="1347" height="1070" fill="#ffffff"/>
<text x="300.0" y="112.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="32" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">BUILD — the register is a markdown table Kerd already knows how to check</tspan>
</text>
<text x="300.0" y="139.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">one file in the consuming project&#x27;s own repo; AU7/AU8 ride the existing audit</tspan>
<tspan x="300.0" dy="18.8">TECH-008 the same files  ·  NFR-004 no scatter  ·  TECH-007 git + Claude Code native</tspan>
</text>
<text x="300.0" y="186.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">DECISIONS are dashed  ·  ARTIFACTS are listed right</tspan>
</text>
<text x="300.0" y="206.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="14" fill="#e03131" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">RED — cost, or a route that leaves the stage / blocks it</tspan>
</text>
<text x="300.0" y="226.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="14" fill="#2f9e44" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">GREEN — Tony&#x27;s input into the work: his annotations, his corrections</tspan>
</text>
<text x="300.0" y="246.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="14" fill="#1971c2" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">BLUE — changed since you last marked this reviewed</tspan>
</text>
<text x="300.0" y="320.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="26" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">1</tspan>
</text>
<text x="344.0" y="313.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="344.0" dy="0.0">STORE</tspan>
</text>
<rect x="660.0" y="288.0" width="600.0" height="60.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
<text x="960.0" y="323.2" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="960.0" dy="0.0">Where a requirement actually lives</tspan>
</text>
<text x="678.0" y="368.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">docs/requirements/register.md   one markdown table, one row per requirement</tspan>
<tspan x="678.0" dy="15.0">docs/requirements/categories.md the twenty-category disposition</tspan>
<tspan x="678.0" dy="15.0"></tspan>
<tspan x="678.0" dy="15.0">plain text. the project&#x27;s own git repo. no index, no database,</tspan>
<tspan x="678.0" dy="15.0">no shadow copy, no sync step. a model reads and WRITES a</tspan>
<tspan x="678.0" dy="15.0">requirement with Read/Edit — no tool invocation in the capture path.</tspan>
</text>
<text x="1320.0" y="304.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">measured: a 117-line</tspan>
<tspan x="1320.0" dy="15.0">checker + 11 fixtures</tspan>
<tspan x="1320.0" dy="15.0">passed first run against</tspan>
<tspan x="1320.0" dy="15.0">the real kit.py.</tspan>
</text>
<polyline points="960.0,472.0 960.0,506.0" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="960.0" y1="506.0" x2="954.3" y2="496.6" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round"/>
<line x1="960.0" y1="506.0" x2="965.7" y2="496.6" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round"/>
<text x="300.0" y="538.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="26" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">2</tspan>
</text>
<text x="344.0" y="531.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="344.0" dy="0.0">INSTALL</tspan>
</text>
<rect x="660.0" y="506.0" width="600.0" height="60.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
<text x="960.0" y="541.2" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="960.0" dy="0.0">What every consuming project must have — measured, not read</tspan>
</text>
<text x="678.0" y="586.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">nothing.</tspan>
<tspan x="678.0" dy="15.0"></tspan>
<tspan x="678.0" dy="15.0">tools/ is 10,112 lines of stdlib-only Python across 35 files</tspan>
<tspan x="678.0" dy="15.0">with no dependency manifest of any kind. AU7/AU8 add no</tspan>
<tspan x="678.0" dy="15.0">CI step — they ride gate.py audit, on the AU5/AU6 precedent.</tspan>
</text>
<text x="1320.0" y="522.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">the only option that</tspan>
<tspan x="1320.0" dy="15.0">imposes nothing on a</tspan>
<tspan x="1320.0" dy="15.0">consuming project.</tspan>
</text>
<polyline points="960.0,673.0 960.0,707.0" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="960.0" y1="707.0" x2="954.3" y2="697.6" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round"/>
<line x1="960.0" y1="707.0" x2="965.7" y2="697.6" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round"/>
<text x="300.0" y="739.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="26" fill="#e03131" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">3</tspan>
</text>
<text x="344.0" y="732.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="13" fill="#e03131" text-anchor="start" xml:space="preserve">
<tspan x="344.0" dy="0.0">GENERATED</tspan>
</text>
<rect x="660.0" y="707.0" width="600.0" height="60.0" rx="8" fill="none" stroke="#e03131" stroke-width="1"/>
<text x="960.0" y="742.2" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="14" fill="#e03131" text-anchor="middle" xml:space="preserve">
<tspan x="960.0" dy="0.0">What appears that nobody wrote by hand</tspan>
</text>
<text x="678.0" y="787.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">the progress board and the journey pages, which already exist.</tspan>
<tspan x="678.0" dy="15.0">progress_kit.derive() counts len(gates_kit.audit(root)) today, so</tspan>
<tspan x="678.0" dy="15.0">a new check appears on the board for free.</tspan>
<tspan x="678.0" dy="15.0"></tspan>
<tspan x="678.0" dy="15.0">NOT delivered, and this is categorical rather than incremental:</tspan>
<tspan x="678.0" dy="15.0">no write-back UI · no PDF · no ReqIF · no baselines · no</tspan>
<tspan x="678.0" dy="15.0">concurrency story beyond merge conflicts.</tspan>
</text>
<text x="1320.0" y="723.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#e03131" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">every page in tools/ is</tspan>
<tspan x="1320.0" dy="15.0">read-only by design and</tspan>
<tspan x="1320.0" dy="15.0">says so on its face.</tspan>
</text>
<polyline points="960.0,908.0 960.0,942.0" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="960.0" y1="942.0" x2="954.3" y2="932.6" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round"/>
<line x1="960.0" y1="942.0" x2="965.7" y2="932.6" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round"/>
<text x="300.0" y="974.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="26" fill="#2f9e44" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">4</tspan>
</text>
<text x="344.0" y="967.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="13" fill="#2f9e44" text-anchor="start" xml:space="preserve">
<tspan x="344.0" dy="0.0">VERDICT</tspan>
</text>
<rect x="660.0" y="942.0" width="600.0" height="60.0" rx="8" fill="none" stroke="#2f9e44" stroke-width="1"/>
<text x="960.0" y="977.2" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="14" fill="#2f9e44" text-anchor="middle" xml:space="preserve">
<tspan x="960.0" dy="0.0">Against the producer&#x27;s three MUST criteria</tspan>
</text>
<text x="678.0" y="1022.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">TECH-008  met BY CONSTRUCTION, not by policy — the register IS</tspan>
<tspan x="678.0" dy="15.0">          the file, so there is nothing to keep in sync.</tspan>
<tspan x="678.0" dy="15.0">NFR-004   one location, two files.</tspan>
<tspan x="678.0" dy="15.0">TECH-007  plain markdown in the project&#x27;s repo.</tspan>
</text>
<text x="1320.0" y="958.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#2f9e44" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">the bar the five external</tspan>
<tspan x="1320.0" dy="15.0">options have to beat.</tspan>
</text>
</svg>