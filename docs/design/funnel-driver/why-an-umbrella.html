<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Conductor works — that is what makes it risky to open</title>
  <style>
    :root{--color-paper:#f5f5f5;--color-ink:#2d3142;--color-muted:#4f5d75;
          --color-accent:#eb6c36;--font-sans:'Geist',system-ui,sans-serif;
          --font-serif:'Instrument Serif',serif;--font-mono:'Geist Mono',ui-monospace,monospace;}
    body{margin:0;padding:48px;background:var(--color-paper);color:var(--color-ink);font-family:var(--font-sans);}
    .wrap{max-width:1000px;margin:0 auto;}
    .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--color-muted);margin:0 0 8px;}
    h1{font-family:var(--font-serif);font-size:34px;font-weight:400;margin:0 0 8px;}
    .sub{color:var(--color-muted);font-size:15px;margin:0 0 28px;max-width:82ch;}
    svg{width:100%;height:auto;display:block;}
  </style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">Kerd · the challenge, drawn</p>
    <h1>Conductor works. That is exactly what makes it risky to open.</h1>
    <p class="sub">You read my prose as "conductor is broken and the other skills are broken too". It is the opposite of that on both counts — and the opposite is the reason to go in pieces.</p>
    <svg viewBox="0 0 960 830" role="img" aria-labelledby="cl-t cl-d">
      <title id="cl-t">Conductor works, which is what makes it risky to open</title>
      <desc id="cl-d">Conductor today carries seven jobs and is in live daily use across three repositories; none of it is broken. Guiding a user through every gate would add six jobs that exist nowhere today. Two forces pull in opposite directions: changing as little as possible, because breaking conductor takes down the only working protocol in three repositories at once, and changing enough to matter, because this project has twice shipped finished machinery that nobody was obliged to use and which produced nothing. The agreed path between them is one piece at a time, each piece paired with the thing that forces it to be used. Separately, the other skills are not broken either: of the funnel's eight stages, five have an owner in some skill and three — frame, slice and design — have none.</desc>
      <defs>
        <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5d75"/></marker>
        <style>
          .n{font-family:var(--font-sans);font-size:12.5px;fill:var(--color-ink);}
          .b{font-family:var(--font-sans);font-size:14px;font-weight:600;fill:var(--color-ink);}
          .ba{font-family:var(--font-sans);font-size:14px;font-weight:600;fill:var(--color-accent);}
          .na{font-family:var(--font-sans);font-size:12.5px;fill:var(--color-accent);}
          .e{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;fill:var(--color-muted);}
          .ea{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;fill:var(--color-accent);}
          .m{font-family:var(--font-sans);font-size:11px;fill:var(--color-muted);}
          .ma{font-family:var(--font-sans);font-size:11px;fill:var(--color-accent);}
          .box{fill:#fff;stroke:#4f5d75;stroke-opacity:.55;}
          .boxa{fill:#fff;stroke:#eb6c36;stroke-opacity:.75;}
          .gap{fill:#fff;stroke:#eb6c36;stroke-dasharray:5 4;}
          .band{fill:none;stroke:#4f5d75;stroke-opacity:.28;stroke-dasharray:3 4;}
        </style>
      </defs>

      <!-- TODAY -->
      <rect class="box" x="30" y="34" width="432" height="300" rx="6"/>
      <text class="e" x="52" y="60">what conductor does today</text>
      <rect class="box" x="286" y="44" width="164" height="22" rx="11"/>
      <text class="e" x="302" y="59">live · daily · 3 repos</text>
      <text class="n" x="52" y="92">reads where the work stands</text>
      <text class="n" x="52" y="118">sizes the job, advises which model to use</text>
      <text class="n" x="52" y="144">frames the task and writes the plan</text>
      <text class="n" x="52" y="170">calls in a spec-writer for big builds</text>
      <text class="n" x="52" y="196">hands steps out to cheaper helpers</text>
      <text class="n" x="52" y="222">checks the evidence before calling it done</text>
      <text class="n" x="52" y="248">commits, pushes, and closes the session</text>
      <text class="b" x="52" y="292">None of this is broken.</text>
      <text class="m" x="52" y="314">It is the part that works, and it is carrying three repos.</text>

      <!-- WOULD ADD -->
      <rect class="boxa" x="498" y="34" width="432" height="300" rx="6"/>
      <text class="ea" x="520" y="60">what "guide the user through every gate" adds</text>
      <text class="na" x="520" y="92">ask the right questions at each gate</text>
      <text class="na" x="520" y="118">check what is still missing</text>
      <text class="na" x="520" y="144">draw the picture for that gate</text>
      <text class="na" x="520" y="170">put it on the screen in front of them</text>
      <text class="na" x="520" y="196">take an approval, or a comment back</text>
      <text class="na" x="520" y="222">only then let them move to the next gate</text>
      <text class="ba" x="520" y="292">None of this exists anywhere today.</text>
      <text class="ma" x="520" y="314">Not in conductor, not in any other skill.</text>

      <!-- THE TWO FORCES -->
      <text class="e" x="30" y="386">two forces, pulling opposite ways</text>
      <rect class="box" x="30" y="398" width="280" height="150" rx="6"/>
      <text class="b" x="52" y="428">Change as little as possible</text>
      <text class="m" x="52" y="454">Break conductor and three repos lose</text>
      <text class="m" x="52" y="472">their only working way of working, all</text>
      <text class="m" x="52" y="490">at once — and nobody finds out until</text>
      <text class="m" x="52" y="508">someone tries to plan something.</text>

      <rect class="box" x="650" y="398" width="280" height="150" rx="6"/>
      <text class="b" x="672" y="428">Change enough to matter</text>
      <text class="m" x="672" y="454">Twice now we have shipped finished,</text>
      <text class="m" x="672" y="472">working machinery that nobody was</text>
      <text class="m" x="672" y="490">obliged to use. Both times it produced</text>
      <text class="m" x="672" y="508">nothing at all.</text>

      <path class="box" d="M 310 473 L 358 473" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#a)" fill="none"/>
      <path class="box" d="M 650 473 L 602 473" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#a)" fill="none"/>

      <rect class="boxa" x="366" y="398" width="228" height="150" rx="6"/>
      <text class="ea" x="386" y="424">the path between them</text>
      <text class="ba" x="386" y="452">One piece at a time</text>
      <text class="ma" x="386" y="478">and every piece paired with</text>
      <text class="ma" x="386" y="496">the thing that forces it to</text>
      <text class="ma" x="386" y="514">actually get used.</text>

      <!-- STAGES -->
      <text class="e" x="30" y="600">and the other skills are not broken either — they just do not cover the whole funnel</text>
      <rect class="band" x="20" y="612" width="910" height="200" rx="8"/>
      <text class="m" x="44" y="644">Of the funnel's eight stages, five have something that owns them. Three have nobody:</text>
      <text class="m" x="44" y="662">nothing anywhere writes the idea, the cut, or the design.</text>
      <rect class="gap" x="44" y="690" width="104" height="72" rx="5"/>
      <text class="na" x="58" y="716" style="font-size:12px">frame</text>
      <text class="ea" x="58" y="736">nobody</text>
      <text class="ma" x="58" y="754" style="font-size:10px">the idea</text>
      <rect class="box" x="154" y="690" width="104" height="72" rx="5"/>
      <text class="n" x="168" y="716" style="font-size:12px">viability</text>
      <text class="e" x="168" y="736">owned</text>
      <rect class="gap" x="264" y="690" width="104" height="72" rx="5"/>
      <text class="na" x="278" y="716" style="font-size:12px">slice</text>
      <text class="ea" x="278" y="736">nobody</text>
      <text class="ma" x="278" y="754" style="font-size:10px">the cut</text>
      <rect class="gap" x="374" y="690" width="104" height="72" rx="5"/>
      <text class="na" x="388" y="716" style="font-size:12px">design</text>
      <text class="ea" x="388" y="736">nobody</text>
      <text class="ma" x="388" y="754" style="font-size:10px">the design</text>
      <rect class="box" x="484" y="690" width="104" height="72" rx="5"/>
      <text class="n" x="498" y="716" style="font-size:12px">contract</text>
      <text class="e" x="498" y="736">owned</text>
      <rect class="box" x="594" y="690" width="104" height="72" rx="5"/>
      <text class="n" x="608" y="716" style="font-size:12px">build</text>
      <text class="e" x="608" y="736">owned</text>
      <rect class="box" x="704" y="690" width="104" height="72" rx="5"/>
      <text class="n" x="718" y="716" style="font-size:12px">goal</text>
      <text class="e" x="718" y="736">owned</text>
      <rect class="box" x="814" y="690" width="104" height="72" rx="5"/>
      <text class="n" x="828" y="716" style="font-size:12px">loop</text>
      <text class="e" x="828" y="736">owned</text>
      <text class="ba" x="44" y="792">5 of 8 owned. The three with nobody are the three at the front — where a person starts.</text>
    </svg>
  </div>
</body>
</html>
