<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A work item is a span. A session is a slice.</title>
  <style>
    :root{--color-paper:#f5f5f5;--color-ink:#2d3142;--color-muted:#4f5d75;
          --color-accent:#eb6c36;--font-sans:'Geist',system-ui,sans-serif;
          --font-serif:'Instrument Serif',serif;--font-mono:'Geist Mono',ui-monospace,monospace;}
    body{margin:0;padding:48px;background:var(--color-paper);color:var(--color-ink);font-family:var(--font-sans);}
    .wrap{max-width:1000px;margin:0 auto;}
    .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--color-muted);margin:0 0 8px;}
    h1{font-family:var(--font-serif);font-size:34px;font-weight:400;margin:0 0 8px;}
    .sub{color:var(--color-muted);font-size:15px;margin:0 0 28px;max-width:82ch;}
    svg{width:100%;height:auto;display:block;}
  </style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">Kerd · funnel-driver · design</p>
    <h1>A work item is a span. A session is a slice.</h1>
    <p class="sub">Drive and conductor own two different objects with two different lifetimes. That is the structural reason Drive sits above conductor rather than inside it — and it is not a preference.</p>
    <svg viewBox="0 0 960 660" role="img" aria-labelledby="sv-t sv-d">
      <title id="sv-t">A work item is a horizontal span; a session is a vertical slice</title>
      <desc id="sv-d">A grid with time running left to right across seven sitting sessions, and three work items as rows. Each work item is a horizontal bar spanning many sessions: funnel-driver runs across six sessions and is still going, gate-visuals across five, rigor-level across two before finishing. One session is highlighted vertically: it crosses two different work items in the same sitting. So a work item outlives many sessions, and a session touches several work items. Underneath, two panels show the consequence. With Drive above conductor, the work item&#8217;s rung advances across session boundaries because its state lives on disk in the work record. With Drive inside conductor, the item&#8217;s ladder would be a phase of the session&#8217;s lifecycle and would restart at frame every sitting, because a session&#8217;s state dies when the session ends.</desc>
      <defs>
        <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5d75"/></marker>
        <style>
          .n{font-family:var(--font-sans);font-size:12.5px;fill:var(--color-ink);}
          .b{font-family:var(--font-sans);font-size:14px;font-weight:600;fill:var(--color-ink);}
          .ba{font-family:var(--font-sans);font-size:14px;font-weight:600;fill:var(--color-accent);}
          .na{font-family:var(--font-sans);font-size:12.5px;fill:var(--color-accent);}
          .e{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;fill:var(--color-muted);}
          .ea{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;fill:var(--color-accent);}
          .m{font-family:var(--font-sans);font-size:11px;fill:var(--color-muted);}
          .ma{font-family:var(--font-sans);font-size:11px;fill:var(--color-accent);}
          .mono{font-family:var(--font-mono);font-size:10.5px;fill:var(--color-muted);}
          .box{fill:#fff;stroke:#4f5d75;stroke-opacity:.55;}
          .bar{fill:#fff;stroke:#4f5d75;stroke-opacity:.7;}
          .bard{fill:#fff;stroke:#4f5d75;stroke-opacity:.35;stroke-dasharray:4 4;}
          .band{fill:#4f5d75;fill-opacity:.05;stroke:#4f5d75;stroke-opacity:.2;stroke-dasharray:3 4;}
          .banda{fill:#eb6c36;fill-opacity:.09;stroke:#eb6c36;stroke-opacity:.65;}
          .rule{stroke:#4f5d75;stroke-opacity:.3;}
        </style>
      </defs>

      <!-- ============ TOP: the grid ============ -->
      <text class="e" x="24" y="26">time, left to right — one sitting per column</text>

      <rect class="band" x="192" y="36" width="96" height="228" rx="3"/>
      <rect class="band" x="288" y="36" width="96" height="228" rx="3"/>
      <rect class="band" x="384" y="36" width="96" height="228" rx="3"/>
      <rect class="banda" x="480" y="36" width="96" height="228" rx="3"/>
      <rect class="band" x="576" y="36" width="96" height="228" rx="3"/>
      <rect class="band" x="672" y="36" width="96" height="228" rx="3"/>
      <rect class="band" x="768" y="36" width="96" height="228" rx="3"/>

      <text class="mono" x="228" y="54">S1</text>
      <text class="mono" x="324" y="54">S2</text>
      <text class="mono" x="420" y="54">S3</text>
      <text class="ea"   x="510" y="54">SESSION 4</text>
      <text class="mono" x="612" y="54">S5</text>
      <text class="mono" x="708" y="54">S6</text>
      <text class="mono" x="804" y="54">S7</text>

      <text class="e" x="24" y="80">work items</text>

      <text class="n" x="24" y="104">funnel-driver</text>
      <rect class="bar" x="192" y="86" width="576" height="26" rx="13"/>
      <text class="m" x="206" y="103">frame → viability → slice → design</text>
      <line class="rule" x1="770" y1="99" x2="852" y2="99" stroke-dasharray="4 4" marker-end="url(#ar)"/>
      <text class="m" x="860" y="103">still going</text>

      <text class="n" x="24" y="158">gate-visuals</text>
      <rect class="bar" x="384" y="140" width="480" height="26" rx="13"/>
      <text class="m" x="398" y="157">frame → design → contract → build → goal</text>

      <text class="n" x="24" y="212">rigor-level</text>
      <rect class="bard" x="192" y="194" width="192" height="26" rx="13"/>
      <text class="m" x="206" y="211">frame → … → done</text>

      <!-- ============ the two readings, as a legend ============ -->
      <rect class="bar" x="24" y="300" width="52" height="18" rx="9"/>
      <text class="b" x="92" y="314">One work item · six sessions</text>
      <text class="m" x="92" y="336">State lives on disk, in the work record.</text>
      <text class="m" x="92" y="354">It survives every session boundary.</text>

      <rect class="banda" x="492" y="288" width="20" height="46" rx="3"/>
      <text class="ba" x="528" y="314">One session · two items</text>
      <text class="ma" x="528" y="336">State lives in kivna/.active-modes</text>
      <text class="ma" x="528" y="354">and dies when the sitting ends.</text>

      <line class="rule" x1="24" y1="386" x2="936" y2="386"/>

      <!-- ============ BOTTOM: the consequence ============ -->
      <text class="e" x="24" y="414">so what happens if you nest one inside the other</text>

      <rect class="box" x="24" y="430" width="444" height="216" rx="6"/>
      <text class="e"  x="46" y="456">drive ABOVE conductor — the agreed shape</text>
      <text class="b"  x="46" y="482">The item&#8217;s rung survives the session.</text>

      <rect class="bar" x="46" y="498" width="120" height="24" rx="12"/>
      <text class="mono" x="62" y="514">session 4</text>
      <rect class="bar" x="182" y="498" width="120" height="24" rx="12"/>
      <text class="mono" x="198" y="514">session 5</text>
      <rect class="bar" x="318" y="498" width="120" height="24" rx="12"/>
      <text class="mono" x="334" y="514">session 6</text>

      <line class="rule" x1="46" y1="538" x2="430" y2="538" marker-end="url(#ar)"/>
      <text class="n" x="46" y="560">slice</text>
      <text class="n" x="182" y="560">design</text>
      <text class="n" x="318" y="560">contract</text>
      <text class="m" x="46" y="590">Each sitting picks the item up where disk says it is,</text>
      <text class="m" x="46" y="608">and leaves it one rung further on.</text>
      <text class="m" x="46" y="632">Drive reads the rung. Conductor never sees it.</text>

      <rect class="box" x="492" y="430" width="444" height="216" rx="6"/>
      <text class="ea" x="514" y="456">drive INSIDE conductor — the category error</text>
      <text class="ba" x="514" y="482">The item&#8217;s ladder restarts every sitting.</text>

      <rect class="bar" x="514" y="498" width="120" height="24" rx="12"/>
      <text class="mono" x="530" y="514">session 4</text>
      <rect class="bar" x="650" y="498" width="120" height="24" rx="12"/>
      <text class="mono" x="666" y="514">session 5</text>
      <rect class="bar" x="786" y="498" width="120" height="24" rx="12"/>
      <text class="mono" x="802" y="514">session 6</text>

      <text class="na" x="514" y="560">frame</text>
      <text class="na" x="650" y="560">frame</text>
      <text class="na" x="786" y="560">frame</text>

      <text class="ma" x="514" y="590">A session&#8217;s state dies when the session ends, so the</text>
      <text class="ma" x="514" y="608">item&#8217;s position has nowhere to live between them.</text>
      <text class="ma" x="514" y="632">Every awkward clause in the graduation map is this.</text>
    </svg>
  </div>
</body>
</html>
