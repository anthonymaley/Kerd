<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hollow treatment made checkable</title>
  <style>
    :root{--color-paper:#f5f5f5;--color-ink:#2d3142;--color-muted:#4f5d75;
          --color-accent:#eb6c36;--font-sans:'Geist',system-ui,sans-serif;
          --font-serif:'Instrument Serif',serif;--font-mono:'Geist Mono',ui-monospace,monospace;}
    body{margin:0;padding:48px;background:var(--color-paper);color:var(--color-ink);
         font-family:var(--font-sans);}
    .wrap{max-width:1000px;margin:0 auto;}
    .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;
             text-transform:uppercase;color:var(--color-muted);margin:0 0 8px;}
    h1{font-family:var(--font-serif);font-size:34px;font-weight:400;margin:0 0 8px;}
    .sub{color:var(--color-muted);font-size:15px;margin:0 0 28px;}
    svg{width:100%;height:auto;display:block;}
  </style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">Kerd · risk-state-split · design</p>
    <h1>Hollow treatment made checkable</h1>
    <p class="sub">A treatment is not proven merely because its field is populated — and evidence cannot be demanded before the work that produces it exists. The demand moves with the ladder.</p>
    <svg viewBox="0 0 1000 810" role="img" aria-labelledby="hol-title hol-desc">
      <title id="hol-title">Hollow treatment made checkable</title>
      <desc id="hol-desc">Top: the conflict exposed. Today one Evidence cell is asked to carry two different facts: what sizes the risk — the 2026-08-03 definition, a test or an analysis with impact in the value's units — and what proves the treatment, which has no home and gets smeared into Countermeasure prose. One field doing two jobs is the defect this item fixes, one column over. Middle: the fix. Evidence renames to Risk evidence and keeps its meaning; Treatment evidence is a new column holding either a citation the machine can check exists — a fixture file, a rule in a named file, a commit — or the honest forward declaration in one exact grammar — planned, dash, what will exist, dot, the expected repo-relative location — while the evidence cannot exist yet. Bottom: the demand moves with the ladder, the producer's shape. From viability through handoff a fatal row advances on a planned treatment — permanent, or temporary with its return condition named — and the planned marker is the machine-readable admission that nothing is proven yet; demanding resolution here would permanently block the item that must build the evidence, the circular dependency refused in revision one. In the loop the work happens and the cell converts from planned to a resolving citation. At acceptance planned no longer suffices: the citation must resolve — the treatment is verified — or the row refuses. At non-fatal the column is optional — no proof obligations invented for the fifty-two existing countermeasure rows; the residual is named, with a widening trigger. The declared limit, in the producer's words: the machine verifies that a citation resolves; the producer decides whether it supports the treatment.</desc>
      <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5d75"/></marker>
        <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#eb6c36"/></marker>
        <style>
          .n{font-family:var(--font-sans);font-size:13px;fill:var(--color-ink);}
          .b{font-family:var(--font-sans);font-size:13px;font-weight:600;fill:var(--color-ink);}
          .m{font-family:var(--font-sans);font-size:11px;fill:var(--color-muted);}
          .e{font-family:var(--font-mono);font-size:9px;fill:var(--color-muted);}
          .box{fill:#fff;stroke:#4f5d75;stroke-opacity:.55;}
          .bad{fill:#e9e6e3;stroke:#9b2c2c;stroke-opacity:.5;stroke-dasharray:5 3;}
          .fix{fill:#fff;stroke:#eb6c36;stroke-width:1.6;}
          .lim{fill:#2d3142;}
          .cw{font-family:var(--font-sans);font-size:13px;font-weight:600;fill:#fff;}
          .cm{font-family:var(--font-sans);font-size:11px;fill:#cfd4e0;}
          .vR{font-family:var(--font-mono);font-size:11px;font-weight:600;fill:#9b2c2c;}
          .vP{font-family:var(--font-mono);font-size:11px;font-weight:600;fill:#2d6a4f;}
        </style>
      </defs>

      <!-- the conflict -->
      <text class="e" x="16" y="24">THE CONFLICT — EXPOSED, NOT PAPERED OVER</text>
      <rect class="bad" x="16" y="36" width="968" height="130" rx="6"/>
      <text class="b" x="36" y="62">Today, one cell called "Evidence" is asked to carry two different facts</text>
      <rect class="box" x="36" y="78" width="440" height="70" rx="6"/>
      <text class="b" x="52" y="100">what sizes the RISK</text>
      <text class="m" x="52" y="118">the 2026-08-03 definition: a test or an analysis —</text>
      <text class="m" x="52" y="132">impact in the value's units, likelihood separate</text>
      <rect class="box" x="508" y="78" width="452" height="70" rx="6"/>
      <text class="b" x="524" y="100">what proves the TREATMENT</text>
      <text class="m" x="524" y="118">no home today — smeared into Countermeasure prose,</text>
      <text class="m" x="524" y="132">indistinguishable from the claim it should be proving</text>
      <text class="e" x="36" y="160">one field · two jobs — the defect this item fixes, one column over</text>

      <path d="M 500 166 L 500 194" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ah)" fill="none"/>

      <!-- the fix -->
      <text class="e" x="16" y="214">THE FIX — TWO COLUMNS, SELF-DESCRIBING</text>
      <rect class="box" x="16" y="226" width="472" height="112" rx="6"/>
      <text class="b" x="32" y="250">Risk evidence</text>
      <text class="m" x="32" y="268">the old Evidence column, renamed — meaning unchanged,</text>
      <text class="m" x="32" y="282">cell contents untouched by the migration</text>
      <text class="n" x="32" y="306">still answers: how do we know the risk is this big,</text>
      <text class="n" x="32" y="322">this likely?</text>

      <rect class="fix" x="512" y="226" width="472" height="112" rx="6"/>
      <text class="b" x="528" y="250">Treatment evidence — new</text>
      <text class="m" x="528" y="268">a citation the machine can check EXISTS — a fixture file,</text>
      <text class="m" x="528" y="282">a rule in a named file, a commit — or the honest forward</text>
      <text class="m" x="528" y="296">declaration while evidence cannot exist yet:</text>
      <text class="e" x="528" y="316">planned — &lt;what will exist&gt; · &lt;expected location&gt;</text>

      <path d="M 748 338 L 748 366" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#ao)" fill="none"/>

      <!-- the lifecycle -->
      <text class="e" x="16" y="386">THE DEMAND MOVES WITH THE LADDER — THE PRODUCER'S SHAPE, REVISION 2</text>

      <rect class="fix" x="16" y="398" width="304" height="130" rx="6"/>
      <text class="b" x="32" y="422">viability → handoff</text>
      <text class="vP" x="32" y="444">planned advances — declared, not verified</text>
      <text class="m" x="32" y="462">a countermeasure stated — permanent, or</text>
      <text class="m" x="32" y="476">temporary with its return condition named —</text>
      <text class="m" x="32" y="490">and evidence in the planned form</text>
      <text class="e" x="32" y="512">'planned' is the machine-readable</text>
      <text class="e" x="32" y="524">admission: stated, never called proven</text>

      <rect class="box" x="348" y="398" width="304" height="130" rx="6"/>
      <text class="b" x="364" y="422">loop</text>
      <text class="m" x="364" y="444">the work that produces the evidence</text>
      <text class="m" x="364" y="458">happens here — it cannot exist earlier,</text>
      <text class="m" x="364" y="472">which is why demanding it earlier would</text>
      <text class="m" x="364" y="486">block the item that must build it</text>
      <text class="e" x="364" y="512">the cell converts: planned — … →</text>
      <text class="e" x="364" y="524">the resolving citation</text>

      <rect class="fix" x="680" y="398" width="304" height="130" rx="6"/>
      <text class="b" x="696" y="422">acceptance</text>
      <text class="vR" x="696" y="444">planned no longer suffices</text>
      <text class="m" x="696" y="462">the citation must resolve — verified —</text>
      <text class="m" x="696" y="476">or the row refuses (fixture 5):</text>
      <text class="e" x="696" y="496">"treatment still planned, not verified —</text>
      <text class="e" x="696" y="510">acceptance requires resolving</text>
      <text class="e" x="696" y="524">Treatment evidence"</text>

      <path d="M 320 463 L 348 463" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ah)" fill="none"/>
      <path d="M 652 463 L 680 463" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ah)" fill="none"/>

      <!-- non-fatal scope -->
      <rect class="box" x="16" y="552" width="968" height="76" rx="6"/>
      <text class="b" x="36" y="576">At non-fatal the column is optional — no invented proof</text>
      <text class="m" x="36" y="596">the 52 existing countermeasure rows are not handed a proof obligation mid-migration · residual NAMED: a non-fatal treatment can still be hollow ·</text>
      <text class="m" x="36" y="612">widening trigger: one caught having mattered → the demand binds on all countermeasure rows, as its own item</text>

      <path d="M 500 628 L 500 656" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ah)" fill="none"/>

      <!-- the limit -->
      <rect class="lim" x="16" y="656" width="968" height="92" rx="8"/>
      <text class="cw" x="36" y="682">THE DECLARED LIMIT — "the machine verifies that a citation resolves; the producer decides whether it supports the treatment"</text>
      <text class="cm" x="36" y="704">Resolution proves the cited file or commit EXISTS — never that a fixture passes, never that the evidence proves anything. Retrieval, not</text>
      <text class="cm" x="36" y="720">comprehension — the same declared limit as grounding-was-read. A real file with a phantom symbol inside still passes: the known AU5 gap,</text>
      <text class="cm" x="36" y="736">inherited and named here so a green check is read at its true strength.</text>

      <text class="m" x="16" y="774">Ruled out: overloading Evidence or Countermeasure with the proof (one field, two jobs — the defect this item fixes) · demanding resolving</text>
      <text class="m" x="16" y="790">evidence at the viability parse (revision 1 — a circular dependency: it blocks the item that must build the evidence; refused by the producer).</text>
    </svg>
  </div>
</body>
</html>
