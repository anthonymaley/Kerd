<tspan x="960.0" dy="0.0">Six measurement families, each a named command</tspan>
</text>
<text x="678.0" y="1359.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">config dead: git ls-files .slainte empty; zero refs in</tspan>
<tspan x="678.0" dy="15.0">slainte; tend refs = deprecated rows only (count derived at</tspan>
<tspan x="678.0" dy="15.0">contract). read-only identity dead: zero hits in slainte +</tspan>
<tspan x="678.0" dy="15.0">state-contract. wires exist once each; conductor contains NO</tspan>
<tspan x="678.0" dy="15.0">slainte check descriptions (single-definition law). charter</tspan>
<tspan x="678.0" dy="15.0">split written: CI-owns pointer &gt;= 1, &#x27;Version sync&#x27; as kept</tspan>
<tspan x="678.0" dy="15.0">rule = 0. skriv wire &gt;= 1. map one-liner new + pair regen&#x27;d.</tspan>
</text>
<text x="1320.0" y="1295.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">honest limit, NAMED: the</tspan>
<tspan x="1320.0" dy="15.0">trigger is prompt-layer -</tspan>
<tspan x="1320.0" dy="15.0">a skipped pass is today&#x27;s</tspan>
<tspan x="1320.0" dy="15.0">status quo; CI graduation</tspan>
<tspan x="1320.0" dy="15.0">sits behind the accepted</tspan>
<tspan x="1320.0" dy="15.0">risk&#x27;s review trigger.</tspan>
<tspan x="1320.0" dy="15.0">rigor mvp: measured =</tspan>
<tspan x="1320.0" dy="15.0">greps/diffs; waived-by-name</tspan>
<tspan x="1320.0" dy="15.0">= first triggered pass at</tspan>
<tspan x="1320.0" dy="15.0">the next real release.</tspan>
</text>
