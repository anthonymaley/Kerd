<tspan x="300.0" dy="0.0">2</tspan>
</text>
<text x="344.0" y="531.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="13" fill="#2f9e44" text-anchor="start" xml:space="preserve">
<tspan x="344.0" dy="0.0">CHANGE</tspan>
</text>
<rect x="660.0" y="506.0" width="600.0" height="60.0" rx="8" fill="none" stroke="#2f9e44" stroke-width="1"/>
<text x="960.0" y="541.2" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="14" fill="#2f9e44" text-anchor="middle" xml:space="preserve">
<tspan x="960.0" dy="0.0">Triggered, fixing, restrained - never remembered</tspan>
</text>
<text x="678.0" y="586.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">a conductor task whose commit bumps the version fields IS a</tspan>
<tspan x="678.0" dy="15.0">release; close-out runs the pass BEFORE the boundary: tend&#x27;s</tspan>
<tspan x="678.0" dy="15.0">drift check + slainte&#x27;s narrative sweep of the repo surfaces</tspan>
<tspan x="678.0" dy="15.0">(README + What&#x27;s New, playbook, capability lists, touched</tspan>
<tspan x="678.0" dy="15.0">living docs). findings become FIXES - work commits under the</tspan>
<tspan x="678.0" dy="15.0">verification gate, skriv&#x27;s audit on the prose. orient offers</tspan>
<tspan x="678.0" dy="15.0">tend on a bare repo. standalone slainte/tend stay invocable.</tspan>
</text>
<text x="1320.0" y="522.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#2f9e44" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">restraint is reported:</tspan>
<tspan x="1320.0" dy="15.0">anything judged deliberate-</tspan>
<tspan x="1320.0" dy="15.0">not-drift is NAMED as left</tspan>
<tspan x="1320.0" dy="15.0">untouched - the killer</tspan>
<tspan x="1320.0" dy="15.0">risk&#x27;s countermeasure.</tspan>
</text>
