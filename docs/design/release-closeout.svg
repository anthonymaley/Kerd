<tspan x="344.0" dy="0.0">MECHANISM</tspan>
</text>
<rect x="660.0" y="741.0" width="600.0" height="60.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
<text x="960.0" y="776.2" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="960.0" dy="0.0">One release definition, two invokes, a charter split</tspan>
</text>
<text x="678.0" y="821.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">triggers = the version-field diff (CI&#x27;s R1 set, reused) OR a</tspan>
<tspan x="678.0" dy="15.0">goal record landing (feature closed as complete) - one release</tspan>
<tspan x="678.0" dy="15.0">definition, two firing moments. conductor INVOKES /kerd:tend and</tspan>
<tspan x="678.0" dy="15.0">/kerd:slainte (the invoke pattern&#x27;s 3rd + 4th uses; zero</tspan>
<tspan x="678.0" dy="15.0">re-description, same law as v0.84.0). charter split: CI owns</tspan>
<tspan x="678.0" dy="15.0">mechanical (R1-R3, AU1-6 - slainte&#x27;s duplicated rules 1/2/5</tspan>
<tspan x="678.0" dy="15.0">prune to a pointer); the pass owns narrative (rule 7&#x27;s family:</tspan>
<tspan x="678.0" dy="15.0">README claims vs SKILL behaviour, What&#x27;s New honesty,</tspan>
<tspan x="678.0" dy="15.0">state-contract truth, skill counts, hook template).</tspan>
</text>
<text x="1320.0" y="757.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">the .slainte config DIES -</tspan>
<tspan x="1320.0" dy="15.0">targets derive from the</tspan>
<tspan x="1320.0" dy="15.0">repo; the on-demand area</tspan>
<tspan x="1320.0" dy="15.0">audits survive config-less.</tspan>
</text>
