<tspan x="344.0" dy="0.0">NOW</tspan>
</text>
<rect x="660.0" y="288.0" width="600.0" height="60.0" rx="8" fill="none" stroke="#e03131" stroke-width="1"/>
<text x="960.0" y="323.2" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="14" fill="#e03131" text-anchor="middle" xml:space="preserve">
<tspan x="960.0" dy="0.0">The judgment layer waits to be remembered - and never runs</tspan>
</text>
<text x="678.0" y="368.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">slainte usage: ZERO (&#x27;i never use it... im not prompted and</tspan>
<tspan x="678.0" dy="15.0">forget&#x27; - Tony, interviewed). its .slainte target list still</tspan>
<tspan x="678.0" dy="15.0">audits a CHANGELOG dead since 0.14.0. meanwhile five goal</tspan>
<tspan x="678.0" dy="15.0">gates produced five layer-4 blocks - every one a stale-</tspan>
<tspan x="678.0" dy="15.0">narrative gap found AFTER shipping. CI refuses the mechanical</tspan>
<tspan x="678.0" dy="15.0">layer; nothing sweeps the story.</tspan>
</text>
<text x="1320.0" y="304.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#e03131" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">slainte&#x27;s dormant release</tspan>
<tspan x="1320.0" dy="15.0">area already specs the</tspan>
<tspan x="1320.0" dy="15.0">judgment layer (rule 7) -</tspan>
<tspan x="1320.0" dy="15.0">never triggered once.</tspan>
</text>
