<tspan x="300.0" dy="0.0">6</tspan>
</text>
<text x="344.0" y="1434.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="344.0" dy="0.0">PROOF</tspan>
</text>
<rect x="660.0" y="1409.0" width="600.0" height="60.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
<text x="960.0" y="1444.2" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="960.0" dy="0.0">Fixtures + dogfood + the measurement answered</tspan>
</text>
<text x="678.0" y="1489.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">kit.selftest gains four temp-tree cases: resolving (exact +</tspan>
<tspan x="678.0" dy="15.0">glob) -&gt; clean · broken ref -&gt; named verbatim · malformed line</tspan>
<tspan x="678.0" dy="15.0">-&gt; named · absent section -&gt; vacuous pass.</tspan>
<tspan x="678.0" dy="15.0">at ship: both-ways demonstration on the real tree (0.70.0</tspan>
<tspan x="678.0" dy="15.0">pattern). dogfood: this item&#x27;s OWN product doc gains its</tspan>
<tspan x="678.0" dy="15.0">## Grounding section in the build.</tspan>
</text>
<text x="1320.0" y="1425.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">the stage-1 measurement,</tspan>
<tspan x="1320.0" dy="15.0">ANSWERED:</tspan>
<tspan x="1320.0" dy="15.0"></tspan>
<tspan x="1320.0" dy="15.0">broken grounding refs at a</tspan>
<tspan x="1320.0" dy="15.0">pushed tip -&gt; 0: AU5 inside</tspan>
<tspan x="1320.0" dy="15.0">gate.py audit at every tip.</tspan>
<tspan x="1320.0" dy="15.0"></tspan>
<tspan x="1320.0" dy="15.0">CI STAYS SEVEN STEPS.</tspan>
</text>
