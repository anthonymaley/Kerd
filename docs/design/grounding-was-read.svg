<tspan x="960.0" dy="0.0">The product doc declares its reading list</tspan>
</text>
<text x="678.0" y="535.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">docs/product/&lt;slug&gt;.md gains an OPTIONAL section:</tspan>
<tspan x="678.0" dy="15.0">## Grounding</tspan>
<tspan x="678.0" dy="15.0">- &lt;ref&gt; — &lt;why&gt;   (ref = path or glob from repo root)</tspan>
<tspan x="678.0" dy="15.0">the audit gains AU5: every declared ref resolves on disk, or the</tspan>
<tspan x="678.0" dy="15.0">push goes red naming the doc and the broken reference.</tspan>
</text>
<text x="1320.0" y="471.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">lost is a checkable state.</tspan>
<tspan x="1320.0" dy="15.0"></tspan>
<tspan x="1320.0" dy="15.0">slice 1 checks RESOLUTION</tspan>
<tspan x="1320.0" dy="15.0">only. whether the reading</tspan>
<tspan x="1320.0" dy="15.0">happened is slice 2</tspan>
<tspan x="1320.0" dy="15.0">(receipts - priced in the</tspan>
<tspan x="1320.0" dy="15.0">product ledger).</tspan>
</text>
