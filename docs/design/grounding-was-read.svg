<tspan x="300.0" dy="0.0">3</tspan>
</text>
<text x="344.0" y="681.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="344.0" dy="0.0">DECISION</tspan>
</text>
<rect x="660.0" y="656.0" width="600.0" height="60.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
<text x="960.0" y="691.2" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="960.0" dy="0.0">Where declarations live — marks, not a matrix</tspan>
</text>
<text x="678.0" y="736.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">static per-rung table: X - cannot name what THIS work touches;</tspan>
<tspan x="678.0" dy="15.0">duplicates the gate&#x27;s existing existence checks; invents a data</tspan>
<tspan x="678.0" dy="15.0">structure ahead of need.</tspan>
<tspan x="678.0" dy="15.0">per-item ## Grounding: O - carries the actual payload (the</tspan>
<tspan x="678.0" dy="15.0">6-Jul class: related living docs, standing decisions).</tspan>
<tspan x="678.0" dy="15.0">hybrid: deferred - slice 2&#x27;s rung-scoped receipts may want a</tspan>
<tspan x="678.0" dy="15.0">static floor; an extension point, not a debt.</tspan>
</text>
<text x="1320.0" y="672.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">options are not close, so</tspan>
<tspan x="1320.0" dy="15.0">marks suffice - the design</tspan>
<tspan x="1320.0" dy="15.0">instrument&#x27;s own rule:</tspan>
<tspan x="1320.0" dy="15.0">scores only when close,</tspan>
<tspan x="1320.0" dy="15.0">weights only when criteria</tspan>
<tspan x="1320.0" dy="15.0">differ.</tspan>
</text>
