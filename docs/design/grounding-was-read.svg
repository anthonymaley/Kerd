<tspan x="300.0" dy="0.0">4</tspan>
</text>
<text x="344.0" y="916.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="344.0" dy="0.0">MECHANISM</tspan>
</text>
<rect x="660.0" y="891.0" width="600.0" height="60.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
<text x="960.0" y="926.2" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="960.0" dy="0.0">AU5 — parse and refusal, verbatim</tspan>
</text>
<text x="678.0" y="971.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">for every docs/product/*.md: find_section(&#x27;Grounding&#x27;) -&gt;</tspan>
<tspan x="678.0" dy="15.0">absent = vacuous pass (declaring is opting in). per &#x27;- &#x27; line:</tspan>
<tspan x="678.0" dy="15.0">split on the FIRST &#x27; — &#x27;; resolve exact path, or glob with &gt;=1</tspan>
<tspan x="678.0" dy="15.0">match, against the repo root.</tspan>
</text>
<rect x="660.0" y="1041.0" width="250.0" height="84.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
<text x="785.0" y="1071.6" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="13" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="785.0" dy="0.0">CLEAN</tspan>
<tspan x="785.0" dy="16.2">every declared ref resolves</tspan>
<tspan x="785.0" dy="16.2">audit stays: audit: clean</tspan>
</text>
<rect x="930.0" y="1041.0" width="340.0" height="84.0" rx="8" fill="none" stroke="#e03131" stroke-width="1"/>
<text x="1100.0" y="1071.6" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="13" fill="#e03131" text-anchor="middle" xml:space="preserve">
<tspan x="1100.0" dy="0.0">PROBLEMS, named verbatim:</tspan>
<tspan x="1100.0" dy="16.2">grounding reference does not resolve: &lt;ref&gt;</tspan>
<tspan x="1100.0" dy="16.2">grounding line malformed: &lt;line&gt;</tspan>
</text>
<text x="1320.0" y="1149.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">rides gate.py audit =</tspan>
<tspan x="1320.0" dy="15.0">CI step two. rot is caught</tspan>
<tspan x="1320.0" dy="15.0">at the push that causes it,</tspan>
<tspan x="1320.0" dy="15.0">never archaeologically.</tspan>
</text>
