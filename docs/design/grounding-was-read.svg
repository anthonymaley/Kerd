<tspan x="960.0" dy="0.0">Out of scope, named (composer key on the frame)</tspan>
</text>
<text x="678.0" y="1707.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">READ-RECEIPTS at gates: slice 2, carrying the hollow-stamping</tspan>
<tspan x="678.0" dy="15.0">row and the retrieval-not-comprehension claim.</tspan>
<tspan x="678.0" dy="15.0">RUNG-SCOPED grounding + any static floor: slice 2&#x27;s extension</tspan>
<tspan x="678.0" dy="15.0">point, taken only if receipts need it.</tspan>
<tspan x="678.0" dy="15.0">ORPHAN REPORT (artifacts no grounding names): unframed.</tspan>
<tspan x="678.0" dy="15.0">COMPREHENSION PROOFS: never, per the ledger&#x27;s third row.</tspan>
</text>
