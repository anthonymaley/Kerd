<tspan x="960.0" dy="0.0">Grounding today: prose, memory, luck</tspan>
</text>
<text x="678.0" y="368.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">what must be read before producing lives in walk detail and in</tspan>
<tspan x="678.0" dy="15.0">heads. skipped reading leaves no trace - the 6 Jul design doc held</tspan>
<tspan x="678.0" dy="15.0">1 Aug&#x27;s answer, well-named, on disk, unread.</tspan>
</text>
<text x="1320.0" y="304.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#e03131" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">honest finding at design</tspan>
<tspan x="1320.0" dy="15.0">time: A8&#x27;s sketched landing</tspan>
<tspan x="1320.0" dy="15.0">site does NOT exist -</tspan>
<tspan x="1320.0" dy="15.0">check_rung is inline code,</tspan>
<tspan x="1320.0" dy="15.0">there is no kit.GATES table</tspan>
<tspan x="1320.0" dy="15.0">to hold a grounding slot.</tspan>
<tspan x="1320.0" dy="15.0">a static home would be</tspan>
<tspan x="1320.0" dy="15.0">invented, not filled.</tspan>
</text>
