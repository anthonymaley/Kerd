<tspan x="300.0" dy="0.0">5</tspan>
</text>
<text x="344.0" y="1250.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="344.0" dy="0.0">EDGE</tspan>
</text>
<rect x="660.0" y="1225.0" width="600.0" height="60.0" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="960.0" y="1260.2" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="960.0" dy="0.0">Why optional, not required</tspan>
</text>
<text x="678.0" y="1305.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">retrofitting twelve product docs with invented reading lists</tspan>
<tspan x="678.0" dy="15.0">would manufacture exactly the hollow declarations the frame&#x27;s</tspan>
<tspan x="678.0" dy="15.0">killer risk names. grounding grows per new work; the audit</tspan>
<tspan x="678.0" dy="15.0">enforces honesty about what WAS declared.</tspan>
</text>
<text x="1320.0" y="1241.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">residual, named (accepted,</tspan>
<tspan x="1320.0" dy="15.0">per the frame): an absent</tspan>
<tspan x="1320.0" dy="15.0">section means no</tspan>
<tspan x="1320.0" dy="15.0">reachability guarantee for</tspan>
<tspan x="1320.0" dy="15.0">that work item.</tspan>
</text>
