<text x="344.0" y="514.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="13" fill="#2f9e44" text-anchor="start" xml:space="preserve">
<tspan x="344.0" dy="0.0">CHANGE</tspan>
