<tspan x="1320.0" dy="15.0">text is prompt-layer - the</tspan>
<tspan x="1320.0" dy="15.0">invoke is an instruction,</tspan>
<tspan x="1320.0" dy="15.0">not a refuser. rigor mvp:</tspan>
<tspan x="1320.0" dy="15.0">measured = greps + diffs;</tspan>
<tspan x="1320.0" dy="15.0">waived-by-name = first live</tspan>
<tspan x="1320.0" dy="15.0">conducted boundary, next</tspan>
<tspan x="1320.0" dy="15.0">session log.</tspan>
</text>
