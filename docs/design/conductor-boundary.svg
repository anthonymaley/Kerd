<tspan x="960.0" dy="0.0">Invoke is literal - the killer risk dissolves structurally</tspan>
</text>
<text x="678.0" y="787.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">the frame&#x27;s killer risk: two prompt-layer descriptions of the</tspan>
<tspan x="678.0" dy="15.0">boundary drifting apart (best-evidenced failure class - the</tspan>
<tspan x="678.0" dy="15.0">v0.83.0 goal block). dissolved, not mitigated: conductor holds</tspan>
<tspan x="678.0" dy="15.0">ONE instruction to call /kerd:switch out and ZERO descriptions</tspan>
<tspan x="678.0" dy="15.0">of the flow. banner additions live in SWITCH&#x27;s template, so</tspan>
<tspan x="678.0" dy="15.0">both callers get them. switch out cannot tell who called it.</tspan>
</text>
<text x="1320.0" y="723.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
