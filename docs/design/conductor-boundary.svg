<tspan x="678.0" dy="15.0">invoke, handoff paragraph DELETED, execute next-pick paragraph,</tspan>
<tspan x="678.0" dy="15.0">principles bullet -&gt; &#x27;closes the session it conducted&#x27;.</tspan>
<tspan x="678.0" dy="15.0">switch SKILL.md (3): single-definition ownership paragraph,</tspan>
<tspan x="678.0" dy="15.0">second-caller line, banner + /clear ritual line.</tspan>
