<tspan x="960.0" dy="0.0">Close-out invokes the boundary; every close names what&#x27;s next</tspan>
</text>
<text x="678.0" y="569.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">conductor close-out gains step 6: INVOKE /kerd:switch out (the</tspan>
<tspan x="678.0" dy="15.0">Skill tool - literal, proven: switch-in already chains into</tspan>
<tspan x="678.0" dy="15.0">conductor the same way, observed twice tonight). the handoff</tspan>
<tspan x="678.0" dy="15.0">ask dies. at each task&#x27;s verified commit, one line names the</tspan>
<tspan x="678.0" dy="15.0">next pick (plan step mid-spec; TODO Now/Backlog top after).</tspan>
<tspan x="678.0" dy="15.0">the banner ends: &#x27;Free context: type /clear, then switch in&#x27;.</tspan>
</text>
<text x="1320.0" y="505.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#2f9e44" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">suggestion, never a loop:</tspan>
<tspan x="1320.0" dy="15.0">starting the pick stays a</tspan>
<tspan x="1320.0" dy="15.0">human reply. Tony&#x27;s key:</tspan>
<tspan x="1320.0" dy="15.0">&#x27;without building a loop</tspan>
<tspan x="1320.0" dy="15.0">or hook&#x27;.</tspan>
</text>
