<tspan x="300.0" dy="0.0">Conductor-boundary — the close-out runs the boundary · design package</tspan>
</text>
<text x="300.0" y="139.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">slice 1 of docs/product/conductor-boundary.md</tspan>
<tspan x="300.0" dy="18.8">one act closes a conducted session; every close names what&#x27;s next.</tspan>
</text>
