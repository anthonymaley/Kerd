<tspan x="1320.0" dy="15.0">standalone /kerd:switch out</tspan>
<tspan x="1320.0" dy="15.0">(Tony&#x27;s key: usable without</tspan>
<tspan x="1320.0" dy="15.0">conductor) + conductor&#x27;s</tspan>
<tspan x="1320.0" dy="15.0">close-out.</tspan>
</text>
