<tspan x="960.0" dy="0.0">Six measurements, each a named command</tspan>
</text>
<text x="678.0" y="1274.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">handoff ask 1 -&gt; 0: grep &#x27;tell the user to run&#x27; = 0.</tspan>
<tspan x="678.0" dy="15.0">single definition: no switch step-headings in conductor = 0;</tspan>
<tspan x="678.0" dy="15.0">invoke line names /kerd:switch out &gt;= 1.</tspan>
<tspan x="678.0" dy="15.0">banner lines once, in switch: /clear grep = 1 there, 0 in</tspan>
<tspan x="678.0" dy="15.0">conductor. Switch In byte-identical (vault-unhook proof shape).</tspan>
<tspan x="678.0" dy="15.0">Switch Out step-heading list unchanged bar banner body.</tspan>
<tspan x="678.0" dy="15.0">next-pick naming present in execute phase.</tspan>
</text>
<text x="1320.0" y="1210.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
