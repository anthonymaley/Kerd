<tspan x="300.0" dy="0.0">4</tspan>
</text>
<text x="344.0" y="950.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="344.0" dy="0.0">EDITS</tspan>
</text>
<rect x="660.0" y="925.0" width="600.0" height="60.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
