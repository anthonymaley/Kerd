<tspan x="300.0" dy="0.0">6</tspan>
</text>
<text x="344.0" y="1420.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="344.0" dy="0.0">PROOF</tspan>
</text>
<rect x="660.0" y="1395.0" width="600.0" height="60.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
<text x="960.0" y="1430.2" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="960.0" dy="0.0">Three diff-scoped measurements + the honest limit</tspan>
</text>
<text x="678.0" y="1475.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">writes per boundary 1 -&gt; 0: the deletion itself; grep lands at</tspan>
<tspan x="678.0" dy="15.0">exactly two deliberate-path pointers.</tspan>
<tspan x="678.0" dy="15.0">on-demand unchanged: kivna diff = one added sentence, zero</tspan>
<tspan x="678.0" dy="15.0">removals.</tspan>
<tspan x="678.0" dy="15.0">killer feature byte-for-byte: ZERO diff hunks inside ## Switch</tspan>
<tspan x="678.0" dy="15.0">In - any hunk there is a build refusal.</tspan>
<tspan x="678.0" dy="15.0">plus: full suite (no tool edits), release sweep R1-R3.</tspan>
</text>
<text x="1320.0" y="1411.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">honest limit, NAMED: skill</tspan>
<tspan x="1320.0" dy="15.0">text is prompt-layer - no</tspan>
<tspan x="1320.0" dy="15.0">runtime refuser observes a</tspan>
<tspan x="1320.0" dy="15.0">session&#x27;s tool calls.</tspan>
<tspan x="1320.0" dy="15.0">rigor mvp disposition:</tspan>
<tspan x="1320.0" dy="15.0">measured = 3 diff checks +</tspan>
<tspan x="1320.0" dy="15.0">sweep; waived-by-name =</tspan>
<tspan x="1320.0" dy="15.0">live-boundary observation</tspan>
<tspan x="1320.0" dy="15.0">(first real switch-out,</tspan>
<tspan x="1320.0" dy="15.0">next session log).</tspan>
</text>
