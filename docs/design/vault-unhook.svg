<tspan x="300.0" dy="0.0">5</tspan>
</text>
<text x="344.0" y="1202.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="344.0" dy="0.0">DECISION</tspan>
</text>
<rect x="660.0" y="1177.0" width="600.0" height="60.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
<text x="960.0" y="1212.2" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="960.0" dy="0.0">Delete-and-renumber beats a tombstone step</tspan>
</text>
<text x="678.0" y="1257.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">delete + renumber: O - the skill reads clean to a new user;</tspan>
<tspan x="678.0" dy="15.0">living docs describe what IS, git archives what was.</tspan>
<tspan x="678.0" dy="15.0">tombstone &#x27;step 4 (removed)&#x27;: X - a numbered hole documents</tspan>
<tspan x="678.0" dy="15.0">history, not behavior.</tspan>
<tspan x="678.0" dy="15.0">cost, named: one playbook gotcha cites &#x27;step 5&#x27; - a dated</tspan>
<tspan x="678.0" dy="15.0">incident record, left as archaeology.</tspan>
</text>
<text x="1320.0" y="1193.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">options not close - marks</tspan>
<tspan x="1320.0" dy="15.0">suffice, no matrix.</tspan>
</text>
