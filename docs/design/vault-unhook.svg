<tspan x="344.0" dy="0.0">NOW</tspan>
</text>
<rect x="660.0" y="288.0" width="600.0" height="60.0" rx="8" fill="none" stroke="#e03131" stroke-width="1"/>
<text x="960.0" y="323.2" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#e03131" text-anchor="middle" xml:space="preserve">
<tspan x="960.0" dy="0.0">The boundary pays a toll nobody collects</tspan>
</text>
<text x="678.0" y="368.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">every full switch-out writes the vault - Status, Weekly, domain</tspan>
<tspan x="678.0" dy="15.0">files - real tokens, every boundary, every project. readers:</tspan>
<tspan x="678.0" dy="15.0">ZERO. no human opens Obsidian (all three users, interviewed</tspan>
<tspan x="678.0" dy="15.0">2026-08-06); no machine reads it (write-only by design). one</tspan>
<tspan x="678.0" dy="15.0">user hit session limits MID-switch-out paying this bill.</tspan>
</text>
<text x="1320.0" y="304.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#e03131" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">the insurance is already</tspan>
<tspan x="1320.0" dy="15.0">delivered twice: immutable</tspan>
<tspan x="1320.0" dy="15.0">kivna/sessions/ logs +</tspan>
<tspan x="1320.0" dy="15.0">git history of every</tspan>
<tspan x="1320.0" dy="15.0">CONTEXT.md version.</tspan>
</text>
