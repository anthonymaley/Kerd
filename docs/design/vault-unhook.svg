<tspan x="300.0" dy="0.0">3</tspan>
</text>
<text x="344.0" y="715.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="344.0" dy="0.0">COVERAGE</tspan>
</text>
<rect x="660.0" y="690.0" width="600.0" height="60.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
<text x="960.0" y="725.2" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="960.0" dy="0.0">Every vault artifact&#x27;s fate — nothing dies silently</tspan>
</text>
<text x="678.0" y="770.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">Status.md -&gt; duplicated in repo (CONTEXT + newest log).</tspan>
<tspan x="678.0" dy="15.0">Weekly.md -&gt; re-curation of repo records; deliberate save.</tspan>
<tspan x="678.0" dy="15.0">MOC -&gt; static index; deliberate save.</tspan>
<tspan x="678.0" dy="15.0">domain files (Architecture, Playbook, guides) -&gt; human-curated</tspan>
<tspan x="678.0" dy="15.0">re-statements; vault-only prose kept via deliberate save.</tspan>
<tspan x="678.0" dy="15.0">people/ -&gt; VAULT-ONLY, the genuine residue - untouched, writable.</tspan>
<tspan x="678.0" dy="15.0">client/engagement/research slots -&gt; vault-only where they exist.</tspan>
</text>
<text x="1320.0" y="706.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">the killer risk&#x27;s</tspan>
<tspan x="1320.0" dy="15.0">countermeasure IS this</tspan>
<tspan x="1320.0" dy="15.0">table. the one truly</tspan>
<tspan x="1320.0" dy="15.0">vault-only class (people/,</tspan>
<tspan x="1320.0" dy="15.0">curated prose) keeps its</tspan>
<tspan x="1320.0" dy="15.0">full write path.</tspan>
</text>
