<tspan x="960.0" dy="0.0">Out of scope, named (composer key on the frame)</tspan>
</text>
<text x="678.0" y="1710.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">BOUNDARY AUTO-SIZING (light/low die): Backlog, own slice -</tspan>
<tspan x="678.0" dy="15.0">the modifier table&#x27;s shape is left alone bar the vault row.</tspan>
<tspan x="678.0" dy="15.0">CYCLE AUTOMATION (out -&gt; clear -&gt; in): Backlog High, own frame.</tspan>
<tspan x="678.0" dy="15.0">KIVNA VERDICT (import/export/scaffold archaeology): Backlog.</tspan>
<tspan x="678.0" dy="15.0">VAULT DELETION OR MIGRATION: never in this slice.</tspan>
<tspan x="678.0" dy="15.0">SCHEDULED SAVES: only if the stale-insurance trigger fires.</tspan>
</text>
