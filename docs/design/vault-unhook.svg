<tspan x="300.0" dy="0.0">2</tspan>
</text>
<text x="344.0" y="514.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="344.0" dy="0.0">CHANGE</tspan>
</text>
<rect x="660.0" y="489.0" width="600.0" height="60.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
<text x="960.0" y="524.2" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="960.0" dy="0.0">Opt-in everywhere, deliberate path untouched</tspan>
</text>
<text x="678.0" y="569.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">switch-out: vault step DELETED (all modes collapse on the vault</tspan>
<tspan x="678.0" dy="15.0">axis). tend: a missing vault is a legitimate opt-out, one info</tspan>
<tspan x="678.0" dy="15.0">line, never a warning. kivna save: THE one way vault pages get</tspan>
<tspan x="678.0" dy="15.0">written - invoked on purpose at natural breakpoints.</tspan>
<tspan x="678.0" dy="15.0">nothing in any existing vault is deleted or moved.</tspan>
</text>
<text x="1320.0" y="505.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">the switch-IN path is not</tspan>
<tspan x="1320.0" dy="15.0">edited AT ALL - the killer</tspan>
<tspan x="1320.0" dy="15.0">feature (fresh session,</tspan>
<tspan x="1320.0" dy="15.0">switch in, one second ago)</tspan>
<tspan x="1320.0" dy="15.0">is out of bounds by</tspan>
<tspan x="1320.0" dy="15.0">construction.</tspan>
</text>
<polyline points="960.0,656.0 960.0,690.0" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
