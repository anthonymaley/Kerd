<tspan x="960.0" dy="0.0">Four files, one principle</tspan>
</text>
<text x="678.0" y="1005.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">switch SKILL.md (the bulk): step 4 deleted + renumber; modifier</tspan>
<tspan x="678.0" dy="15.0">table drops the Vault row; description, intro, usage, triage,</tspan>
<tspan x="678.0" dy="15.0">fallback all drop vault language; banner gains ONE conditional</tspan>
<tspan x="678.0" dy="15.0">line when vault.json exists (&#x27;vault not written - on-demand&#x27;).</tspan>
<tspan x="678.0" dy="15.0">kivna SKILL.md: ONE sentence added (save is deliberate; switch</tspan>
<tspan x="678.0" dy="15.0">no longer calls it). tend SKILL.md: Cat-3 missing-vault nag -&gt;</tspan>
<tspan x="678.0" dy="15.0">info line; present vault keeps every check. vault-spec: opt-in</tspan>
<tspan x="678.0" dy="15.0">sentence in Ownership. plus README x3 sections, v0.83.0.</tspan>
</text>
<text x="1320.0" y="941.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">kivna&#x27;s touch is minimal</tspan>
<tspan x="1320.0" dy="15.0">BY DESIGN - the kivna</tspan>
<tspan x="1320.0" dy="15.0">verdict review (Backlog)</tspan>
<tspan x="1320.0" dy="15.0">should meet an unmodified</tspan>
<tspan x="1320.0" dy="15.0">surface.</tspan>
</text>
