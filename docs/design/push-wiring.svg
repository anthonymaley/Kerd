<text x="960.0" y="323.2" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#e03131" text-anchor="middle" xml:space="preserve">
<tspan x="960.0" dy="0.0">The ship flow today</tspan>
</text>
<text x="678.0" y="368.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">commit work (Piece: trailer) -&gt; push. the render refreshes only when</tspan>
<tspan x="678.0" dy="15.0">someone remembers, in a later commit, maybe a later push.</tspan>
</text>
<text x="1320.0" y="304.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#e03131" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">measured 2026-08-04:</tspan>
<tspan x="1320.0" dy="15.0">two manual rounds in one</tspan>
<tspan x="1320.0" dy="15.0">session; between them the</tspan>
<tspan x="1320.0" dy="15.0">committed render MISSTATES</tspan>
<tspan x="1320.0" dy="15.0">position (mode-cut strip:</tspan>
<tspan x="1320.0" dy="15.0">&#x27;9 landed&#x27; after all 11).</tspan>
</text>
