<text x="300.0" y="1636.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26" fill="#2f9e44" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">7</tspan>
</text>
<text x="344.0" y="1629.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#2f9e44" text-anchor="start" xml:space="preserve">
<tspan x="344.0" dy="0.0">SCOPE</tspan>
</text>
<rect x="660.0" y="1604.0" width="600.0" height="60.0" rx="8" fill="none" stroke="#2f9e44" stroke-width="1" stroke-dasharray="8 6"/>
<text x="960.0" y="1639.2" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#2f9e44" text-anchor="middle" xml:space="preserve">
<tspan x="960.0" dy="0.0">Out of scope, named (composer key on the frame)</tspan>
</text>
<text x="678.0" y="1684.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">AUTO-PUSH of the refreshed render (hook or CI-side commit): the</tspan>
<tspan x="678.0" dy="15.0">ledger&#x27;s accepted unknown stands untested - review trigger fires</tspan>
<tspan x="678.0" dy="15.0">if any slice proposes CI write-back.</tspan>
<tspan x="678.0" dy="15.0">GATE.PY rendering have/need through the progress view: a later</tspan>
<tspan x="678.0" dy="15.0">slice.</tspan>
</text>
</svg>