<text x="300.0" y="948.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">4</tspan>
</text>
<text x="344.0" y="941.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="344.0" dy="0.0">CI</tspan>
</text>
<rect x="660.0" y="916.0" width="600.0" height="60.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
<text x="960.0" y="951.2" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="960.0" dy="0.0">Seventh step — and a defect caught at design time</tspan>
</text>
<text x="678.0" y="996.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">gate.yml gains: &#x27;Progress render current&#x27; -&gt; python3</tspan>
<tspan x="678.0" dy="15.0">tools/diagram/progress.py stale, after Matrix audit.</tspan>
</text>
<rect x="660.0" y="1032.0" width="600.0" height="110.0" rx="8" fill="none" stroke="#e03131" stroke-width="1"/>
<text x="960.0" y="1059.4" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#e03131" text-anchor="middle" xml:space="preserve">
<tspan x="960.0" dy="0.0">DEFECT FOUND: actions/checkout@v4 defaults to DEPTH 1.</tspan>
<tspan x="960.0" dy="16.2">the renderer derives landed pieces from git log trailers -</tspan>
<tspan x="960.0" dy="16.2">a shallow checkout sees ONE commit, derives an emptier model,</tspan>
<tspan x="960.0" dy="16.2">and refuses EVERY push. the fix ships with this slice:</tspan>
<tspan x="960.0" dy="16.2">checkout gains fetch-depth: 0.</tspan>
</text>
<text x="1320.0" y="1046.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#e03131" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">same bug class as the 0.71.1</tspan>
<tspan x="1320.0" dy="15.0">absolute-REPO refusal: local</tspan>
<tspan x="1320.0" dy="15.0">verifies pass in an environment</tspan>
<tspan x="1320.0" dy="15.0">CI doesn&#x27;t have. the progress</tspan>
<tspan x="1320.0" dy="15.0">selftest never noticed - its</tspan>
<tspan x="1320.0" dy="15.0">fixtures build their own trees.</tspan>
</text>
<polyline points="960.0,1168.0 960.0,1202.0" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="960.0" y1="1202.0" x2="954.3" y2="1192.6" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round"/>
<line x1="960.0" y1="1202.0" x2="965.7" y2="1192.6" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round"/>
<text x="300.0" y="1234.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">5</tspan>
</text>
<text x="344.0" y="1227.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="344.0" dy="0.0">EVIDENCE</tspan>
</text>
<rect x="660.0" y="1202.0" width="600.0" height="60.0" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="960.0" y="1237.2" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="960.0" dy="0.0">Why an exact byte-compare is safe</tspan>
</text>
<text x="678.0" y="1282.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">read from the toolkit 2026-08-04: ids counter-based, seeds</tspan>
<tspan x="678.0" dy="15.0">arithmetic (10000 + n*7) · no random, no time/date anywhere ·</tspan>
<tspan x="678.0" dy="15.0">every output-feeding glob sorted() · REPO root-independent since</tspan>
<tspan x="678.0" dy="15.0">0.71.1 · SVG text metrics are pure arithmetic, no font query.</tspan>
</text>
<text x="1320.0" y="1218.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">RESIDUAL, named: Mac vs</tspan>
<tspan x="1320.0" dy="15.0">Linux byte-identity is</tspan>
<tspan x="1320.0" dy="15.0">UNPROVEN until the first CI</tspan>
<tspan x="1320.0" dy="15.0">run - the ship run IS the</tspan>
<tspan x="1320.0" dy="15.0">proof. if it ever diverges:</tspan>
<tspan x="1320.0" dy="15.0">normalise before compare,</tspan>
<tspan x="1320.0" dy="15.0">never weaken to a semantic</tspan>
<tspan x="1320.0" dy="15.0">diff.</tspan>
</text>
<polyline points="960.0,1352.0 960.0,1386.0" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="960.0" y1="1386.0" x2="954.3" y2="1376.6" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round"/>
<line x1="960.0" y1="1386.0" x2="965.7" y2="1376.6" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round"/>
<text x="300.0" y="1418.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">6</tspan>
</text>
<text x="344.0" y="1411.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="344.0" dy="0.0">PROOF</tspan>
</text>
<rect x="660.0" y="1386.0" width="600.0" height="60.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
<text x="960.0" y="1421.2" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="960.0" dy="0.0">Fixtures + the both-ways demonstration</tspan>
</text>
<text x="678.0" y="1466.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">selftest gains three temp-tree fixtures: converged -&gt; 0 ·</tspan>
<tspan x="678.0" dy="15.0">drifted (source changed after render) -&gt; 1 naming both files,</tspan>
<tspan x="678.0" dy="15.0">fix line asserted VERBATIM · missing pair -&gt; 1.</tspan>
<tspan x="678.0" dy="15.0">at ship, refusal demonstrated both ways on the real tree</tspan>
<tspan x="678.0" dy="15.0">(planted stale render -&gt; 1; refreshed pair -&gt; 0), the 0.70.0</tspan>
<tspan x="678.0" dy="15.0">pattern.</tspan>
</text>
<text x="1320.0" y="1402.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">the two stage-1 measurements,</tspan>
<tspan x="1320.0" dy="15.0">ANSWERED:</tspan>
<tspan x="1320.0" dy="15.0"></tspan>
<tspan x="1320.0" dy="15.0">staleness at a push tip -&gt; 0:</tspan>
<tspan x="1320.0" dy="15.0">CI refuses any differing tip.</tspan>
<tspan x="1320.0" dy="15.0"></tspan>
<tspan x="1320.0" dy="15.0">remember-steps -&gt; 0: nothing</tspan>
<tspan x="1320.0" dy="15.0">remembered - forgetting yields</tspan>
<tspan x="1320.0" dy="15.0">a refusal carrying the fix</tspan>
<tspan x="1320.0" dy="15.0">(fixture-checked).</tspan>
</text>
<polyline points="960.0,1570.0 960.0,1604.0" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
