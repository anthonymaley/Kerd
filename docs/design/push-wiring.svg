<tspan x="300.0" dy="0.0">2</tspan>
</text>
<text x="344.0" y="463.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="344.0" dy="0.0">CHANGE</tspan>
</text>
<rect x="660.0" y="438.0" width="600.0" height="60.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
<text x="960.0" y="473.2" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="960.0" dy="0.0">The ship flow under the gate</tspan>
</text>
<text x="678.0" y="518.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">commit -&gt; refresh -&gt; commit the render pair -&gt; ONE push.</tspan>
<tspan x="678.0" dy="15.0">CI step 7 byte-compares fresh vs committed at every pushed tip;</tspan>
<tspan x="678.0" dy="15.0">different = refused, and the message carries the exact fix.</tspan>
</text>
<text x="1320.0" y="454.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">named cost (ledger row 3,</tspan>
<tspan x="1320.0" dy="15.0">RED): a per-piece push is</tspan>
<tspan x="1320.0" dy="15.0">now a two-commit pair; a</tspan>
<tspan x="1320.0" dy="15.0">forgotten refresh costs one</tspan>
<tspan x="1320.0" dy="15.0">extra local round.</tspan>
<tspan x="1320.0" dy="15.0"></tspan>
<tspan x="1320.0" dy="15.0">a push touching nothing the</tspan>
<tspan x="1320.0" dy="15.0">render reads compares equal</tspan>
<tspan x="1320.0" dy="15.0">and passes untouched.</tspan>
</text>
<polyline points="960.0,571.0 960.0,605.0" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="960.0" y1="605.0" x2="954.3" y2="595.6" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round"/>
<line x1="960.0" y1="605.0" x2="965.7" y2="595.6" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round"/>
<text x="300.0" y="637.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">3</tspan>
</text>
<text x="344.0" y="630.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="344.0" dy="0.0">MECHANISM</tspan>
</text>
<rect x="660.0" y="605.0" width="600.0" height="60.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
<text x="960.0" y="640.2" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="960.0" dy="0.0">progress.py stale — check-only, mutates nothing</tspan>
</text>
<text x="678.0" y="685.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">render the pair to a TEMP dir (never the working tree) -&gt;</tspan>
<tspan x="678.0" dy="15.0">byte-compare each against docs/plans/progress.{excalidraw,svg}</tspan>
<tspan x="678.0" dy="15.0">on disk. in CI, disk IS the pushed tip; locally the answer is</tspan>
<tspan x="678.0" dy="15.0">&#x27;would CI refuse this tree?&#x27;. both files compared - a hand-edited</tspan>
<tspan x="678.0" dy="15.0">SVG is drift too.</tspan>
</text>
<rect x="660.0" y="772.0" width="250.0" height="84.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
<text x="785.0" y="802.6" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="785.0" dy="0.0">EXIT 0</tspan>
<tspan x="785.0" dy="16.2">both identical</tspan>
<tspan x="785.0" dy="16.2">prints: render current</tspan>
</text>
<rect x="930.0" y="772.0" width="330.0" height="84.0" rx="8" fill="none" stroke="#e03131" stroke-width="1"/>
<text x="1095.0" y="794.5" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#e03131" text-anchor="middle" xml:space="preserve">
<tspan x="1095.0" dy="0.0">EXIT 1</tspan>
<tspan x="1095.0" dy="16.2">any difference, or either file missing</tspan>
<tspan x="1095.0" dy="16.2">names each file + the fix VERBATIM:</tspan>
<tspan x="1095.0" dy="16.2">run the renderer, add the pair, commit</tspan>
</text>
<text x="1320.0" y="786.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">convergence: render-only</tspan>
<tspan x="1320.0" dy="15.0">commits carry NO trailer,</tspan>
<tspan x="1320.0" dy="15.0">so refresh divergence stops</tspan>
<tspan x="1320.0" dy="15.0">at depth 1 (probed 2026-08-04,</tspan>
<tspan x="1320.0" dy="15.0">md5 pair identical).</tspan>
</text>
