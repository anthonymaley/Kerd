<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>What a measurable success condition contains, and what carries it</title>
  <style>
    :root{--color-paper:#f5f5f5;--color-ink:#2d3142;--color-muted:#4f5d75;
          --color-accent:#eb6c36;--font-sans:'Geist',system-ui,sans-serif;
          --font-serif:'Instrument Serif',serif;--font-mono:'Geist Mono',ui-monospace,monospace;}
    body{margin:0;padding:48px;background:var(--color-paper);color:var(--color-ink);
         font-family:var(--font-sans);}
    .wrap{max-width:920px;margin:0 auto;}
    .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;
             text-transform:uppercase;color:var(--color-muted);margin:0 0 8px;}
    h1{font-family:var(--font-serif);font-size:34px;font-weight:400;margin:0 0 8px;}
    .sub{color:var(--color-muted);font-size:15px;margin:0 0 28px;}
    svg{width:100%;height:auto;display:block;}
  </style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">Kerd · requirements-success-measurement · design</p>
    <h1>What a measurable success condition contains, and what carries it</h1>
    <p class="sub">Four objects. Two are joined by a typed edge stored <strong>both ways</strong>; the fourth is not linked at all — the immutable record binds itself to the living condition.</p>
    <svg viewBox="0 0 920 1016" role="img"
         aria-labelledby="anatomy-title anatomy-desc">
      <title id="anatomy-title">What a measurable success condition contains, and what carries it</title>
      <desc id="anatomy-desc">Four objects. A Requirement, unchanged and gaining no new field, is joined to a Success condition by the measured-by role. That role is stored as TWO edges rather than one, a departure from the incumbent convention: Requirement measured-by Success condition stores the condition's full four-field approval fingerprint, and Success condition measures Requirement stores the requirement's legacy statement-only fingerprint, because the two directions carry different payloads. The audit requires both directions for this pair; a missing reciprocal edge or a stale stamp is a finding at the existing suspect-link severity, deliberately not inflated into a refusal in this slice, and existing role pairs are not retrofitted. The Success condition is a new register block under a new category MSC, owning four fields: Statement, what counts as met; Measure, the unit counted; Baseline, what it reads today; and Target, the value that counts as met. It deliberately does not own Method and does not own Evidence. The Success condition is verified-by a Test or method, an existing TST block that owns Method, how the reading is taken. The fourth object is the Observed result, and its home was settled on 2026-09-01: it is an entry in the immutable acceptance record, never a register block. There is no third link role. An earlier version of this drawing carried evidenced-by, Success condition to Observed result; it is removed, because the Observed result is not a register block and there is nothing for an ID-only link role to point at. The arrow is therefore reversed and no longer a catalog link at all: the immutable record entry binds itself to the living condition by naming the MSC and carrying its exact frozen fingerprint. The living condition gains no outbound file reference and no post-key mutation, and discovery is derived by scanning immutable acceptance records for entries naming the MSC ID. The entry carries seven fields and nine required facts: the MSC ID and its frozen fingerprint, both on the Condition line; the observed value and its unit; the method reference; the date the reading was taken; the evidence path; the evidence digest; and the outcome. An entry qualifies only when all eight conditions listed at the foot of the drawing hold, including a valid Taken date, and a non-qualifying entry yields NOT ASSESSABLE, never PROVEN and never NOT MET. Two digests do two different jobs and must not be merged: the approval fingerprint is a canonical payload over declared fields and protects target identity, while Evidence-SHA256 is a plain hash over an artifact's raw bytes and protects evidence identity. External evidence must be captured as a stable local snapshot before acceptance; a bare URL or a mutable CI-run location is insufficient in this slice, and provider-native immutable evidence is deferred to the out-of-repo artifacts problem. Marked in accent: the MSC category and the measured-by role are introduced by this design and do not exist today; verified-by exists today but is re-sourced, moving its source from the requirement to the success condition. None of it is built in this slice.</desc>
      <defs>
        <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5d75"/></marker>
        <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#eb6c36"/></marker>
        <style>
          .n{font-family:var(--font-sans);font-size:13px;fill:var(--color-ink);}
          .b{font-family:var(--font-sans);font-size:15px;font-weight:600;fill:var(--color-ink);}
          .e{font-family:var(--font-mono);font-size:9px;fill:var(--color-muted);}
          .ea{font-family:var(--font-mono);font-size:9px;fill:var(--color-accent);font-weight:600;}
          .m{font-family:var(--font-sans);font-size:11px;fill:var(--color-muted);}
          .ma{font-family:var(--font-sans);font-size:11px;fill:var(--color-accent);}
          .box{fill:#fff;stroke:#4f5d75;stroke-opacity:.55;}
          .new{fill:#fff;stroke:#eb6c36;stroke-width:1.6;}
        </style>
      </defs>

      <!-- Requirement -->
      <rect class="box" x="16" y="110" width="200" height="140" rx="6"/>
      <text class="b" x="34" y="138">Requirement</text>
      <text class="e" x="34" y="155">FUN-010 · PRD-002 · EXISTS</text>
      <text class="n" x="34" y="182">Statement · Source</text>
      <text class="n" x="34" y="202">ID · Category · State</text>
      <text class="n" x="34" y="222">Approved · Tags</text>
      <text class="ma" x="34" y="242">gains nothing</text>

      <!-- measured-by / measures : TWO stored edges -->
      <text class="ea" x="220" y="156">measured-by</text>
      <path d="M 216 168 L 328 168" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#aa)" fill="none"/>
      <path d="M 328 198 L 216 198" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#aa)" fill="none"/>
      <text class="ea" x="238" y="216">measures</text>
      <text class="ea" x="220" y="234">NEW · 2 EDGES</text>

      <!-- Success condition -->
      <rect class="new" x="332" y="88" width="252" height="214" rx="6"/>
      <text class="b" x="350" y="116">Success condition</text>
      <text class="ea" x="350" y="133">MSC-nnn · NEW CATEGORY</text>
      <text class="n" x="350" y="162">Statement — what counts as met</text>
      <text class="n" x="350" y="184">Measure — the unit counted</text>
      <text class="n" x="350" y="206">Baseline — what it reads today</text>
      <text class="n" x="350" y="228">Target — the value that counts</text>
      <text class="m" x="350" y="256">not Method · not Evidence</text>
      <text class="m" x="350" y="274">declared BEFORE design, then keyed</text>
      <text class="e" x="350" y="292">+ register State · Source · Approved</text>

      <!-- verified-by -->
      <text class="ea" x="596" y="150">verified-by</text>
      <text class="ea" x="596" y="163">RE-SOURCED</text>
      <path d="M 584 176 L 696 176" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#aa)" fill="none"/>
      <text class="e" x="596" y="194">was: req → test</text>

      <!-- Test / method -->
      <rect class="box" x="700" y="128" width="196" height="104" rx="6"/>
      <text class="b" x="718" y="156">Test / method</text>
      <text class="e" x="718" y="173">TST-nnn · EXISTS</text>
      <text class="n" x="718" y="200">Method — how the</text>
      <text class="n" x="718" y="220">reading is taken</text>

      <!-- the binding: record -> condition, REVERSED, and not a link role -->
      <path d="M 458 418 L 458 308" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#aa)" fill="none"/>
      <text class="ea" x="472" y="336">binds UPWARD · NOT a link role</text>
      <text class="e" x="472" y="352">the record names the MSC and carries</text>
      <text class="e" x="472" y="366">its exact frozen fingerprint</text>
      <text class="ma" x="472" y="386">the condition never reaches forward</text>
      <text class="ma" x="472" y="402">into history · no post-key mutation</text>

      <!-- Observed result -->
      <rect class="new" x="300" y="424" width="316" height="214" rx="6"/>
      <text class="b" x="318" y="452">Observed result</text>
      <text class="ea" x="318" y="469">AN ENTRY IN THE IMMUTABLE ACCEPTANCE RECORD</text>
      <text class="e" x="318" y="496">Condition:       MSC-007 (fingerprint:…)</text>
      <text class="e" x="318" y="513">Observed:        &lt;value&gt; &lt;unit&gt;</text>
      <text class="e" x="318" y="530">Method:          TST-014</text>
      <text class="e" x="318" y="547">Taken:           YYYY-MM-DD</text>
      <text class="e" x="318" y="564">Evidence:        &lt;repo-relative path&gt;</text>
      <text class="ea" x="318" y="581">Evidence-SHA256: &lt;64 lowercase hex&gt;</text>
      <text class="e" x="318" y="598">Outcome:         PROVEN | NOT MET</text>
      <text class="m" x="318" y="622">dated · immutable · never edited</text>

      <!-- stamping note -->
      <rect class="box" x="640" y="424" width="256" height="214" rx="6"/>
      <text class="b" x="658" y="452">Stamped BOTH ways now</text>
      <text class="e" x="658" y="474">req --measured-by--&gt; MSC</text>
      <text class="m" x="658" y="490">stores the MSC's full 4-field fp</text>
      <text class="e" x="658" y="512">MSC --measures--&gt; req</text>
      <text class="m" x="658" y="528">stores the req's statement-only fp</text>
      <text class="ma" x="658" y="552">the audit REQUIRES both directions</text>
      <text class="ma" x="658" y="568">missing or stale = FINDING</text>
      <text class="m" x="658" y="584">not a refusal, in this slice</text>
      <text class="e" x="658" y="608">existing role pairs NOT retrofitted</text>

      <!-- qualification -->
      <rect class="box" x="16" y="664" width="880" height="176" rx="6" stroke="#eb6c36" stroke-width="1.6"/>
      <text class="b" x="36" y="692">An entry QUALIFIES only when all eight hold — otherwise NOT ASSESSABLE, never PROVEN, never NOT MET</text>
      <text class="n" x="36" y="718">1 · Condition names an MSC that exists</text>
      <text class="n" x="36" y="740">2 · its fingerprint matches the MSC version used for the decision</text>
      <text class="n" x="36" y="762">3 · Evidence resolves to a repo-relative file that exists</text>
      <text class="n" x="36" y="784">4 · Evidence-SHA256 recomputes over its raw bytes and matches</text>
      <text class="n" x="520" y="718">5 · Observed carries a value AND a unit</text>
      <text class="n" x="520" y="740">6 · Method names a TST</text>
      <text class="n" x="520" y="762">7 · Taken is a valid YYYY-MM-DD date</text>
      <text class="n" x="520" y="784">8 · Outcome is exactly PROVEN or NOT MET</text>
      <text class="ma" x="36" y="816">a missing file or a digest mismatch is not a BAD reading — it is NOT A READING</text>

      <!-- legend -->
      <line x1="16" y1="870" x2="896" y2="870" stroke="#4f5d75" stroke-opacity=".3"/>
      <rect class="box" x="16" y="890" width="22" height="14" rx="3"/>
      <text class="m" x="48" y="902">exists in the schema today</text>
      <rect class="new" x="240" y="890" width="22" height="14" rx="3"/>
      <text class="ma" x="272" y="902">introduced by this design — none of it is built in this slice</text>
      <text class="m" x="16" y="934">SEVEN fields, NINE required facts, EIGHT qualification conditions — the Condition line carries two facts (ID and</text>
      <text class="m" x="16" y="954">fingerprint) and Observed carries two (value and unit). Two digests, two jobs, never merged: the approval fingerprint</text>
      <text class="m" x="16" y="974">protects TARGET identity over declared fields; Evidence-SHA256 protects EVIDENCE identity over raw bytes.</text>
      <text class="ma" x="16" y="996">External evidence is snapshotted locally before acceptance. A bare URL or a mutable CI-run location is insufficient here.</text>
    </svg>
  </div>
</body>
</html>
