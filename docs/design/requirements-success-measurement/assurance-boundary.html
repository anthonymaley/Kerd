    <p class="eyebrow">Kerd · requirements-success-measurement · design</p>
    <h1>Where assurance comes from at each rung, and where it does not</h1>
    <p class="sub">Four sources, and a check that <em>finds</em> is not a check that <em>refuses</em>. This slice adds <strong>no automated per-rigor floor</strong> — the drawing exists so that limit cannot later be mistaken for machinery.</p>
    <svg viewBox="0 0 920 990" role="img" aria-labelledby="ab-title ab-desc">
      <title id="ab-title">Where assurance comes from at each rung, and where it does not</title>
      <desc id="ab-desc">For each rung of the ladder, the drawing names what assures the success condition and by what mechanism. Assurance comes from four sources, marked distinctly. Machine-refused means something on disk refuses and blocks. Machine-detected means machinery emits a finding but does not refuse; it is a real check that does not block, and it is deliberately not counted among the refusal-backed checks. Producer-agreed means a human key with nothing outside the model enforcing it. No enforcement means nothing checks at all. That four-way split replaced a three-way one on 2026-09-01 evening, at the producer's finding that the drawing's own legend defined machine-checked as something on disk refuses while reciprocal stamping explicitly produces a finding rather than a refusal; both claims could not stand. At scope, the Scope section and a legal rigor level are machine-refused by the existing gate, but whether a success condition was declared at all is not enforced. At design, one approved and sealed view per declared concern is machine-refused; whether the condition's target is proportionate to the declared rigor level is producer-agreed only. At the design gate two questions sit. Whether the keyed target has drifted since approval becomes machine-refused only once the versioned MSC approval fingerprint is built; today's register Approved recipe hashes the statement alone and would not detect a changed measure, baseline or target. And whether the Requirement to MSC link is stamped in both directions with neither stamp stale becomes machine-detected once reciprocal stamping is built: the audit requires both directions and emits a finding at the existing suspect-link severity, deliberately not inflated into a refusal in this slice. At work handoff the spec must carry Pieces and a Verify on every step, machine-refused; whether the condition is actually named on the steps it affects has no enforcement. In the loop, zero unchecked pieces is machine-refused; whether the work is aimed at the condition has no enforcement. At acceptance five questions sit. The acceptance record and its Release condition section are machine-refused. Whether the work is done and meets the agreed goal is the producer's key. Whether an observed-result entry exists, names the MSC and carries its exact frozen fingerprint becomes machine-refused once the structural acceptance-record parser is built; that check covers all eight qualification conditions, including a valid Taken date. Whether the reading satisfies the frozen target is producer-agreed: the producer explicitly judges it and keys the outcome into the record, and what remains absent is machine recomputation of that semantic comparison. And whether the evidence artifact is the one that was actually judged becomes machine-refused once the parser recomputes Evidence-SHA256 over the referenced file's raw bytes. The summary distinguishes current from designed state because four questions are dual-marked and counting both markers as two lines would make proposed assurance read as present assurance. There are fifteen assurance questions carrying nineteen markers. The count was thirteen at the design GO of 2026-08-31; the rulings of 2026-09-01 added two questions and moved two more, and every figure here is re-derived from these rows rather than adjusted from the old totals. Today: five machine-refused, zero machine-detected, three producer-agreed, seven unenforced, so ten of the fifteen rest on agreement or on nothing. Once the designed machinery is built: eight machine-refused, one machine-detected, three producer-agreed, three unenforced. The three that stay unenforced in both tenses are that a success condition was declared at all, that the condition is named on the steps it affects, and that the work is actually aimed at the condition. This slice adds no automated per-rigor floor, and Drive does not structurally guarantee compliance, the same sentence carried in the work record's risk ledger.</desc>

      <rect x="16" y="550" width="880" height="118" rx="6" fill="#fff" stroke="#eb6c36" stroke-width="1.6"/>
      <text class="b" x="36" y="580">This slice adds no automated per-rigor floor.</text>
      <text class="n" x="36" y="604">The control is the producer declaring the rigor level and agreeing a proportionate success condition at scope.</text>
      <text class="n" x="36" y="626">It binds by agreement at one gate. Nothing outside the model enforces it.</text>
