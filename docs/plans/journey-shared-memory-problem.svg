<svg viewBox="0 0 340 232" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Back in the room: code artifacts survive, human input does not, so the direction has to be given again"
     font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">

  <text x="170" y="14" font-size="9.5" font-weight="700" fill="#5C6B67" text-anchor="middle" letter-spacing="0.8">BACK IN THE ROOM</text>

  <rect x="4" y="24" width="160" height="88" rx="9" fill="#FFFFFF" stroke="#3E7C4F" stroke-width="1.5"/>
  <text x="84" y="41" font-size="9" font-weight="700" fill="#3E7C4F" text-anchor="middle">STILL THERE</text>
  <text x="84" y="57" font-size="9" fill="#22312F" text-anchor="middle">commits · files · gates</text>
  <text x="84" y="70" font-size="9" fill="#22312F" text-anchor="middle">tests · the code</text>
  <line x1="24" y1="79" x2="144" y2="79" stroke="#E4E7E4" stroke-width="1"/>
  <text x="84" y="93" font-size="8.5" fill="#5C6B67" text-anchor="middle">code leaves artifacts,</text>
  <text x="84" y="104" font-size="8.5" fill="#5C6B67" text-anchor="middle">and they cannot lie</text>

  <rect x="176" y="24" width="160" height="88" rx="9" fill="#FDFBFB" stroke="#C6453F" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="256" y="41" font-size="9" font-weight="700" fill="#C6453F" text-anchor="middle">GONE</text>
  <text x="256" y="57" font-size="9" fill="#8C5450" text-anchor="middle">the idea · the direction</text>
  <text x="256" y="70" font-size="9" fill="#8C5450" text-anchor="middle">what we considered</text>
  <line x1="196" y1="79" x2="316" y2="79" stroke="#F0DEDC" stroke-width="1"/>
  <text x="256" y="93" font-size="8.5" fill="#8C5450" text-anchor="middle">≈90% of Tony's input,</text>
  <text x="256" y="104" font-size="8.5" fill="#8C5450" text-anchor="middle">and it leaves nothing</text>

  <line x1="170" y1="114" x2="170" y2="132" stroke="#C6453F" stroke-width="1.5"/>
  <polygon points="170,138 166,128 174,128" fill="#C6453F"/>
  <text x="178" y="128" font-size="8.5" fill="#C6453F" font-weight="600">cause</text>

  <rect x="18" y="142" width="304" height="30" rx="7" fill="#FFFFFF" stroke="#C6453F" stroke-width="1.5"/>
  <text x="170" y="161" font-size="9.5" font-weight="700" fill="#C6453F" text-anchor="middle">human input has nowhere to land — nothing derives it</text>

  <rect x="18" y="182" width="304" height="46" rx="7" fill="#F8E4E2"/>
  <text x="170" y="199" font-size="9.5" font-weight="700" fill="#C6453F" text-anchor="middle">so Tony checks, reminds, and explains it again</text>
  <text x="170" y="214" font-size="9" fill="#8C5450" text-anchor="middle">nervous → dejected → &#8220;I wasted my time and</text>
  <text x="170" y="225" font-size="9" fill="#8C5450" text-anchor="middle">we lost the opportunity&#8221;</text>
</svg>
