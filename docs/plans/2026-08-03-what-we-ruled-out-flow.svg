<svg xmlns="http://www.w3.org/2000/svg" width="1278" height="1580" viewBox="260 40 1278 1580">
<rect x="260" y="40" width="1278" height="1580" fill="#ffffff"/>
<text x="300.0" y="112.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="32" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">What we ruled out, and why — flow</tspan>
</text>
<text x="300.0" y="139.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">CROSS-CUTTING · added 2026-08-03</tspan>
<tspan x="300.0" dy="18.8">four functions independently demanded this output and none had a home for it. not a graveyard — an INPUT, read in grounding.</tspan>
</text>
<text x="300.0" y="186.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">DECISIONS are dashed  ·  ARTIFACTS are listed right</tspan>
</text>
<text x="300.0" y="206.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#e03131" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">RED — cost, or a route that leaves the stage / blocks it</tspan>
</text>
<text x="300.0" y="226.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#2f9e44" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">GREEN — Tony&#x27;s input into the work: his annotations, his corrections</tspan>
</text>
<text x="300.0" y="246.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#1971c2" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">BLUE — changed since you last marked this reviewed</tspan>
</text>
<text x="300.0" y="320.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">1</tspan>
</text>
<text x="344.0" y="313.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="344.0" dy="0.0">IN</tspan>
</text>
<rect x="660.0" y="288.0" width="600.0" height="60.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
<text x="960.0" y="323.2" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="960.0" dy="0.0">An option is eliminated — at any rung</tspan>
</text>
<text x="678.0" y="368.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">a rejected approach and a failed fix are THE SAME THING. one was</tspan>
<tspan x="678.0" dy="15.0">eliminated by an analysis, the other by a test — and those are the same</tspan>
<tspan x="678.0" dy="15.0">kind of evidence differing in cost, as agreed at Test viability.</tspan>
<tspan x="678.0" dy="15.0">splitting them was smuggling back a distinction already dissolved.</tspan>
</text>
<text x="1320.0" y="304.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">the four callers:</tspan>
<tspan x="1320.0" dy="15.0">  gaps that could not be</tspan>
<tspan x="1320.0" dy="15.0">  closed (Frame the intent)</tspan>
<tspan x="1320.0" dy="15.0">  accepted unknowns and</tspan>
<tspan x="1320.0" dy="15.0">  blockers (Test viability)</tspan>
<tspan x="1320.0" dy="15.0">  work we discounted</tspan>
<tspan x="1320.0" dy="15.0">  (Slice a release)</tspan>
<tspan x="1320.0" dy="15.0">  what was deliberately</tspan>
<tspan x="1320.0" dy="15.0">  not built (from cutting</tspan>
<tspan x="1320.0" dy="15.0">  Hold product truth)</tspan>
</text>
<polyline points="960.0,438.0 960.0,472.0" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="960.0" y1="472.0" x2="954.3" y2="462.6" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round"/>
<line x1="960.0" y1="472.0" x2="965.7" y2="462.6" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round"/>
<text x="300.0" y="504.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">2</tspan>
</text>
<text x="344.0" y="497.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="344.0" dy="0.0">DECISION</tspan>
</text>
<rect x="660.0" y="472.0" width="600.0" height="60.0" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="960.0" y="507.2" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="960.0" dy="0.0">Was it ever a CANDIDATE?</tspan>
</text>
<text x="678.0" y="552.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">did someone believe it would work, for a reason?</tspan>
<tspan x="678.0" dy="15.0">  YES  → its elimination is information. record it.</tspan>
<tspan x="678.0" dy="15.0">  NO   → a slip is not an option. a mistyped variable was never a</tspan>
<tspan x="678.0" dy="15.0">         candidate, so its failure says nothing.</tspan>
</text>
<text x="1320.0" y="488.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">this filter is what makes</tspan>
<tspan x="1320.0" dy="15.0">the volume survivable.</tspan>
<tspan x="1320.0" dy="15.0">most failed fixes are</tspan>
<tspan x="1320.0" dy="15.0">slips, not eliminated</tspan>
<tspan x="1320.0" dy="15.0">concepts — so the real</tspan>
<tspan x="1320.0" dy="15.0">volume is far below</tspan>
<tspan x="1320.0" dy="15.0">&#x27;every fix that failed&#x27;.</tspan>
</text>
<polyline points="960.0,622.0 960.0,656.0" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="960.0" y1="656.0" x2="954.3" y2="646.6" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round"/>
<line x1="960.0" y1="656.0" x2="965.7" y2="646.6" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round"/>
<text x="300.0" y="688.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">3</tspan>
</text>
<text x="344.0" y="681.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="344.0" dy="0.0">OUT</tspan>
</text>
<rect x="660.0" y="656.0" width="600.0" height="60.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
<text x="960.0" y="691.2" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="960.0" dy="0.0">ONE entry per CONCEPT — never per attempt</tspan>
</text>
<text x="678.0" y="736.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">what was tried or considered  ·  why it was eliminated  ·  the evidence</tspan>
<tspan x="678.0" dy="15.0">(a test OR an analysis)  ·  and the CONDITION that would bring it back.</tspan>
</text>
<text x="1320.0" y="672.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">NOT the code.</tspan>
<tspan x="1320.0" dy="15.0">NOT the diff.</tspan>
<tspan x="1320.0" dy="15.0">NOT the error output.</tspan>
<tspan x="1320.0" dy="15.0"></tspan>
<tspan x="1320.0" dy="15.0">concepts outlive codebases.</tspan>
<tspan x="1320.0" dy="15.0">&#x27;caching at the edge did</tspan>
<tspan x="1320.0" dy="15.0">not help, the miss rate</tspan>
<tspan x="1320.0" dy="15.0">was already low&#x27; stays true</tspan>
<tspan x="1320.0" dy="15.0">after a rewrite. a diff</tspan>
<tspan x="1320.0" dy="15.0">does not.</tspan>
<tspan x="1320.0" dy="15.0"></tspan>
<tspan x="1320.0" dy="15.0">many failed attempts at</tspan>
<tspan x="1320.0" dy="15.0">one idea are ONE entry.</tspan>
</text>
<polyline points="960.0,772.0 960.0,806.0" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="960.0" y1="806.0" x2="954.3" y2="796.6" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round"/>
<line x1="960.0" y1="806.0" x2="965.7" y2="796.6" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round"/>
<text x="300.0" y="838.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">4</tspan>
</text>
<text x="344.0" y="831.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="344.0" dy="0.0">DECISION</tspan>
</text>
<rect x="660.0" y="806.0" width="600.0" height="60.0" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="960.0" y="841.2" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="960.0" dy="0.0">How does it get captured?</tspan>
</text>
<text x="678.0" y="886.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">capture MUST be a byproduct of work already happening — never a</tspan>
<tspan x="678.0" dy="15.0">separate act of discipline.</tspan>
<tspan x="678.0" dy="15.0">  BUILD-LEVEL  — a failed verify IS the record. conductor already runs</tspan>
<tspan x="678.0" dy="15.0">                 a verify per step and hands back after three failures.</tspan>
<tspan x="678.0" dy="15.0">  DESIGN-LEVEL — hand-written. rare enough to afford it.</tspan>
</text>
<text x="674.0" y="991.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#e03131" text-anchor="start" xml:space="preserve">
<tspan x="674.0" dy="0.0">RUN THROUGH TEST VIABILITY&#x27;S OWN MACHINERY:</tspan>
<tspan x="674.0" dy="15.0"></tspan>
<tspan x="674.0" dy="15.0">  RISK         the record is not maintained at volume</tspan>
<tspan x="674.0" dy="15.0">  IMPACT       high — a stale &#x27;already tried&#x27; list is WORSE</tspan>
<tspan x="674.0" dy="15.0">               than none. it answers confidently and wrongly.</tspan>
<tspan x="674.0" dy="15.0">               that is the exact argument that killed</tspan>
<tspan x="674.0" dy="15.0">               Hold product truth.</tspan>
<tspan x="674.0" dy="15.0">  LIKELIHOOD   high — the standard fate of any log needing</tspan>
<tspan x="674.0" dy="15.0">               discipline to maintain.</tspan>
<tspan x="674.0" dy="15.0">  COUNTERMEASURE   none, at first pass.</tspan>
<tspan x="674.0" dy="15.0"></tspan>
<tspan x="674.0" dy="15.0">  = HIGH IMPACT + HIGH LIKELIHOOD + NO COUNTERMEASURE</tspan>
<tspan x="674.0" dy="15.0">  = DEAD PROJECT, by the rule set an hour earlier.</tspan>
<tspan x="674.0" dy="15.0"></tspan>
<tspan x="674.0" dy="15.0">so BYPRODUCT CAPTURE is not an optimisation. it is the</tspan>
<tspan x="674.0" dy="15.0">condition of this artifact existing at all.</tspan>
</text>
<polyline points="960.0,1223.0 960.0,1257.0" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="960.0" y1="1257.0" x2="954.3" y2="1247.6" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round"/>
<line x1="960.0" y1="1257.0" x2="965.7" y2="1247.6" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round"/>
<text x="300.0" y="1289.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">5</tspan>
</text>
<text x="344.0" y="1282.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="344.0" dy="0.0">READ</tspan>
</text>
<rect x="660.0" y="1257.0" width="600.0" height="60.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
<text x="960.0" y="1292.2" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="960.0" dy="0.0">Consumed in GROUNDING, by everything that proposes</tspan>
</text>
<text x="678.0" y="1337.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">this is the whole point, and it is why the artifact is an input rather</tspan>
<tspan x="678.0" dy="15.0">than a graveyard. a rung cannot start without reading what was already</tspan>
<tspan x="678.0" dy="15.0">ruled out — which is what stops a dead option being re-proposed and</tspan>
<tspan x="678.0" dy="15.0">re-argued from scratch months later.</tspan>
</text>
<text x="1320.0" y="1273.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">SECOND CALLER for the</tspan>
<tspan x="1320.0" dy="15.0">grounding column, and a</tspan>
<tspan x="1320.0" dy="15.0">partial answer to the</tspan>
<tspan x="1320.0" dy="15.0">reachability clause open</tspan>
<tspan x="1320.0" dy="15.0">since this morning:</tspan>
<tspan x="1320.0" dy="15.0"></tspan>
<tspan x="1320.0" dy="15.0">it gets read because a</tspan>
<tspan x="1320.0" dy="15.0">rung CANNOT START without</tspan>
<tspan x="1320.0" dy="15.0">it — not because someone</tspan>
<tspan x="1320.0" dy="15.0">remembers to.</tspan>
</text>
<polyline points="960.0,1407.0 960.0,1441.0" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="960.0" y1="1441.0" x2="954.3" y2="1431.6" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round"/>
<line x1="960.0" y1="1441.0" x2="965.7" y2="1431.6" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round"/>
<text x="300.0" y="1473.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">6</tspan>
</text>
<text x="344.0" y="1466.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="344.0" dy="0.0">RETURN</tspan>
</text>
<rect x="660.0" y="1441.0" width="600.0" height="60.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
<text x="960.0" y="1476.2" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="960.0" dy="0.0">The condition that brings an entry back</tspan>
</text>
<text x="678.0" y="1521.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">written at the moment of elimination, because that is the only moment</tspan>
<tspan x="678.0" dy="15.0">anyone knows what would change the answer.</tspan>
<tspan x="678.0" dy="15.0">&#x27;discounted because X&#x27; ages exactly like an accepted risk and a</tspan>
<tspan x="678.0" dy="15.0">temporary countermeasure — the constraint that killed it may lift.</tspan>
</text>
<text x="1320.0" y="1457.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">THIRD thing today with a</tspan>
<tspan x="1320.0" dy="15.0">return condition: a</tspan>
<tspan x="1320.0" dy="15.0">temporary countermeasure,</tspan>
<tspan x="1320.0" dy="15.0">an accepted risk, and now</tspan>
<tspan x="1320.0" dy="15.0">an eliminated option.</tspan>
<tspan x="1320.0" dy="15.0"></tspan>
<tspan x="1320.0" dy="15.0">three is enough to suspect</tspan>
<tspan x="1320.0" dy="15.0">a general rule rather than</tspan>
<tspan x="1320.0" dy="15.0">three coincidences.</tspan>
</text>
</svg>