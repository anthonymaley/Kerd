<tspan x="118.0" dy="0.0">THE MODEL READS</tspan>
</text>
<text x="117.8" y="177.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="13" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="117.8" dy="0.0">files · markdown · gates</tspan>
<tspan x="117.8" dy="16.2">commits · the code</tspan>
</text>
<text x="116.6" y="224.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
