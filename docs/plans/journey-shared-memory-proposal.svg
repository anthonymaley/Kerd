<tspan x="402.0" dy="0.0">THE HUMAN SEES A WALL</tspan>
</text>
<text x="402.5" y="177.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="13" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="402.5" dy="0.0">the funnel · stages · steps</tspan>
<tspan x="402.5" dy="16.2">risks · architecture · plan</tspan>
</text>
<text x="402.4" y="224.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="12" fill="#2f9e44" text-anchor="middle" xml:space="preserve">
<tspan x="402.4" dy="0.0">the product, in his language</tspan>
</text>
<text x="249.8" y="267.0" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="13" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
