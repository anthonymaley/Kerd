<svg viewBox="0 0 340 232" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="One shared state on disk, rendered twice: files for the model, a wall of pages for the human"
     font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">

  <rect x="66" y="6" width="208" height="42" rx="8" fill="#FFFFFF" stroke="#22312F" stroke-width="1.5"/>
  <text x="170" y="23" font-size="9.5" font-weight="700" fill="#22312F" text-anchor="middle">ONE SHARED STATE, ON DISK</text>
  <text x="170" y="38" font-size="8.5" fill="#5C6B67" text-anchor="middle">derived, never hand-kept — it cannot go stale</text>

  <line x1="120" y1="48" x2="76" y2="72" stroke="#5C6B67" stroke-width="1.3"/>
  <polygon points="70,75 79,70 82,77" fill="#5C6B67"/>
  <line x1="220" y1="48" x2="264" y2="72" stroke="#3E7C4F" stroke-width="1.3"/>
  <polygon points="270,75 258,77 261,70" fill="#3E7C4F"/>

  <rect x="4" y="80" width="156" height="66" rx="9" fill="#FBFAF7" stroke="#B9C0BD" stroke-width="1.5"/>
  <text x="82" y="97" font-size="9" font-weight="700" fill="#5C6B67" text-anchor="middle">THE MODEL READS</text>
  <text x="82" y="113" font-size="9" fill="#22312F" text-anchor="middle">files · markdown · gates</text>
  <text x="82" y="126" font-size="9" fill="#22312F" text-anchor="middle">commits · the code</text>
  <text x="82" y="139" font-size="8.5" fill="#5C6B67" text-anchor="middle">mechanical — its world</text>

  <rect x="180" y="80" width="156" height="66" rx="9" fill="#F4FAF6" stroke="#3E7C4F" stroke-width="1.5"/>
  <text x="258" y="97" font-size="9" font-weight="700" fill="#3E7C4F" text-anchor="middle">TONY SEES A WALL</text>
  <text x="258" y="113" font-size="9" fill="#22312F" text-anchor="middle">the funnel · stages · steps</text>
  <text x="258" y="126" font-size="9" fill="#22312F" text-anchor="middle">risks · architecture · plan</text>
  <text x="258" y="139" font-size="8.5" fill="#3E7C4F" text-anchor="middle">the product, in his language</text>

  <text x="170" y="163" font-size="8.5" fill="#5C6B67" text-anchor="middle" font-style="italic">every stage agreed by a drawing before the next one opens</text>

  <line x1="170" y1="170" x2="170" y2="184" stroke="#3E7C4F" stroke-width="1.5"/>
  <polygon points="170,190 166,180 174,180" fill="#3E7C4F"/>

  <rect x="14" y="194" width="312" height="34" rx="7" fill="#E3EFE6"/>
  <text x="170" y="210" font-size="9.5" font-weight="700" fill="#3E7C4F" text-anchor="middle">we walk back in and carry on</text>
  <text x="170" y="223" font-size="9" fill="#2F6440" text-anchor="middle">a quick recap, then work — nothing re-explained</text>
</svg>
