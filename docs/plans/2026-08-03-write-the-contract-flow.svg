<svg xmlns="http://www.w3.org/2000/svg" width="1463" height="1601" viewBox="260 40 1463 1601">
<rect x="260" y="40" width="1463" height="1601" fill="#ffffff"/>
<text x="300.0" y="112.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="32" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">Write the contract · Size and assign — stage flow</tspan>
</text>
<text x="300.0" y="139.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">CONTRACT rung · interviewed 2026-08-03</tspan>
<tspan x="300.0" dy="18.8">the agreed design becomes a written work order a builder who was never in the room can build from.</tspan>
</text>
<text x="300.0" y="186.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">DECISIONS are dashed  ·  ARTIFACTS are listed right</tspan>
</text>
<text x="300.0" y="206.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#e03131" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">RED — cost, or a route that leaves the stage / blocks it</tspan>
</text>
<text x="300.0" y="226.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#2f9e44" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">GREEN — Tony&#x27;s input into the work: his annotations, his corrections</tspan>
</text>
<text x="300.0" y="246.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#1971c2" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">BLUE — changed since you last marked this reviewed</tspan>
</text>
<text x="300.0" y="320.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">1</tspan>
</text>
<text x="344.0" y="313.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="344.0" dy="0.0">IN</tspan>
</text>
<rect x="660.0" y="288.0" width="600.0" height="60.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
<text x="960.0" y="323.2" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="960.0" dy="0.0">The GO&#x27;d design package — INTACT</tspan>
</text>
<text x="678.0" y="368.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">full specs, documents, diagrams, measurements, plans, UX design,</tspan>
<tspan x="678.0" dy="15.0">systems. nothing summarized on the way in: the contract is written</tspan>
<tspan x="678.0" dy="15.0">FROM upstream truth, not from a digest of it.</tspan>
<tspan x="678.0" dy="15.0">the qualified risks ride with it — a countermeasure is a constraint</tspan>
<tspan x="678.0" dy="15.0">the work order must build around.</tspan>
</text>
<text x="1320.0" y="304.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">design&#x27;s GO already</tspan>
<tspan x="1320.0" dy="15.0">happened. this rung never</tspan>
<tspan x="1320.0" dy="15.0">re-derives or re-approves</tspan>
<tspan x="1320.0" dy="15.0">the design.</tspan>
</text>
<polyline points="960.0,455.0 960.0,489.0" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="960.0" y1="489.0" x2="954.3" y2="479.6" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round"/>
<line x1="960.0" y1="489.0" x2="965.7" y2="479.6" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round"/>
<text x="300.0" y="521.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">2</tspan>
</text>
<text x="344.0" y="514.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="344.0" dy="0.0">GROUNDING</tspan>
</text>
<rect x="660.0" y="489.0" width="600.0" height="60.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
<text x="960.0" y="524.2" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="960.0" dy="0.0">Read before writing the order</tspan>
</text>
<text x="678.0" y="569.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">the TERRAIN the work will change — actual code, read not summarized.</tspan>
<tspan x="678.0" dy="15.0">the order must name exact paths, signatures and values, and it</tspan>
<tspan x="678.0" dy="15.0">cannot do that from memory.</tspan>
<tspan x="678.0" dy="15.0">WHAT WE RULED OUT — a contract proposes implementation choices.</tspan>
<tspan x="678.0" dy="15.0">STANDING DECISIONS — the conventions a work order cannot violate.</tspan>
</text>
<text x="1320.0" y="505.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">same grounding law as</tspan>
<tspan x="1320.0" dy="15.0">design: inputs arrive on</tspan>
<tspan x="1320.0" dy="15.0">their own, grounding is</tspan>
<tspan x="1320.0" dy="15.0">what gets skipped.</tspan>
</text>
<polyline points="960.0,656.0 960.0,690.0" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="960.0" y1="690.0" x2="954.3" y2="680.6" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round"/>
<line x1="960.0" y1="690.0" x2="965.7" y2="680.6" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round"/>
<text x="300.0" y="722.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">3</tspan>
</text>
<text x="344.0" y="715.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="344.0" dy="0.0">THE ORDER</tspan>
</text>
<rect x="660.0" y="690.0" width="600.0" height="60.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
<text x="960.0" y="725.2" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="960.0" dy="0.0">Written so a stranger can build it</tspan>
</text>
<text x="678.0" y="770.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">implementable by a builder who NEVER SAW THE REASONING. every piece</tspan>
<tspan x="678.0" dy="15.0">carries its exact scope, the why behind any non-obvious choice, and</tspan>
<tspan x="678.0" dy="15.0">ITS OWN CHECK — a piece without a check cannot be handed to anyone.</tspan>
</text>
<text x="1320.0" y="706.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">the why travels IN the</tspan>
<tspan x="1320.0" dy="15.0">piece. a builder who</tspan>
<tspan x="1320.0" dy="15.0">re-derives intent drifts,</tspan>
<tspan x="1320.0" dy="15.0">confidently.</tspan>
</text>
<polyline points="960.0,823.0 960.0,857.0" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="960.0" y1="857.0" x2="954.3" y2="847.6" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round"/>
<line x1="960.0" y1="857.0" x2="965.7" y2="847.6" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round"/>
<text x="300.0" y="889.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">4</tspan>
</text>
<text x="344.0" y="882.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="344.0" dy="0.0">SIZE +</tspan>
<tspan x="344.0" dy="16.2">ASSIGN</tspan>
</text>
<rect x="660.0" y="857.0" width="600.0" height="60.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
<text x="960.0" y="892.2" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="960.0" dy="0.0">After the piece is written — never before</tspan>
</text>
<text x="678.0" y="937.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">a tag assigned during planning measures how hard the piece FELT to</tspan>
<tspan x="678.0" dy="15.0">plan, not what judgment survived being written down. write the piece</tspan>
<tspan x="678.0" dy="15.0">in full, then read it and ask what decision is still left in it.</tspan>
</text>
<text x="1320.0" y="873.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">what stays with the</tspan>
<tspan x="1320.0" dy="15.0">overseer after honest</tspan>
<tspan x="1320.0" dy="15.0">tagging is small —</tspan>
<tspan x="1320.0" dy="15.0">and that is correct.</tspan>
</text>
<rect x="660.0" y="990.0" width="290.0" height="64.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
<text x="805.0" y="1018.8" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="805.0" dy="0.0">the OVERSEER</tspan>
<tspan x="805.0" dy="16.2">holds ALL upstream truth</tspan>
</text>
<rect x="970.0" y="990.0" width="290.0" height="64.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
<text x="1115.0" y="1010.6" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="1115.0" dy="0.0">a BUILDER</tspan>
<tspan x="1115.0" dy="16.2">exact spec + related</tspan>
<tspan x="1115.0" dy="16.2">materials — AND NO MORE</tspan>
</text>
<text x="1320.0" y="1004.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#e03131" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">TWO-TIER ACCESS, BY ROLE. the tier is the requirement —</tspan>
<tspan x="1320.0" dy="15.0">not a token-saving trick. a builder holding the whole</tspan>
<tspan x="1320.0" dy="15.0">file re-derives intent from it; a builder holding one</tspan>
<tspan x="1320.0" dy="15.0">self-contained piece builds that piece.</tspan>
</text>
<polyline points="960.0,1084.0 960.0,1118.0" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="960.0" y1="1118.0" x2="954.3" y2="1108.6" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round"/>
<line x1="960.0" y1="1118.0" x2="965.7" y2="1108.6" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round"/>
<text x="300.0" y="1150.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">5</tspan>
</text>
<text x="344.0" y="1143.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="344.0" dy="0.0">APPROVAL</tspan>
</text>
<rect x="660.0" y="1118.0" width="600.0" height="60.0" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="8 6"/>
<text x="960.0" y="1153.2" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="960.0" dy="0.0">Machine key ALONE — no human gate here</tspan>
</text>
<text x="678.0" y="1198.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">every piece is MEASURABLE against an upstream declaration: the design</tspan>
<tspan x="678.0" dy="15.0">package, the measurements, the countermeasures. provided that</tspan>
<tspan x="678.0" dy="15.0">measuring is real, the human reads nothing at this rung.</tspan>
<tspan x="678.0" dy="15.0">a piece NOTHING upstream declared cannot be measured, so it cannot</tspan>
<tspan x="678.0" dy="15.0">pass by assertion — it is a PUSH-BACK to design.</tspan>
</text>
<text x="1320.0" y="1134.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">Tony, 2026-08-03: &#x27;i dont</tspan>
<tspan x="1320.0" dy="15.0">need to approve contract</tspan>
<tspan x="1320.0" dy="15.0">if we can measure it meets</tspan>
<tspan x="1320.0" dy="15.0">output of other stages.&#x27;</tspan>
</text>
<text x="1320.0" y="1209.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#e03131" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">the DONE-assembled rule applied to the</tspan>
<tspan x="1320.0" dy="15.0">contract itself. this REMOVES today&#x27;s</tspan>
<tspan x="1320.0" dy="15.0">per-spec human approval when the</tspan>
<tspan x="1320.0" dy="15.0">machine key holds.</tspan>
</text>
<polyline points="960.0,1285.0 960.0,1319.0" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="960.0" y1="1319.0" x2="954.3" y2="1309.6" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round"/>
<line x1="960.0" y1="1319.0" x2="965.7" y2="1309.6" stroke="#1e1e1e" stroke-width="1" stroke-linecap="round"/>
<text x="300.0" y="1351.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">6</tspan>
</text>
<text x="344.0" y="1344.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="344.0" dy="0.0">HANDOFF</tspan>
</text>
<rect x="660.0" y="1319.0" width="600.0" height="60.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
<text x="960.0" y="1354.2" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="960.0" dy="0.0">→ Execute a unit  (BUILD)</tspan>
</text>
<text x="678.0" y="1399.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="678.0" dy="0.0">pieces flow to builders under the two-tier rule. the ESCALATION</tspan>
<tspan x="678.0" dy="15.0">CONTRACT governs everything downstream: the human hears ONLY of a</tspan>
<tspan x="678.0" dy="15.0">gap no agent role can answer that is a BLOCKER — the blocker-</tspan>
<tspan x="678.0" dy="15.0">acceptance path from Test viability. otherwise the next report is</tspan>
<tspan x="678.0" dy="15.0">GOAL ACHIEVED.</tspan>
</text>
<text x="1320.0" y="1335.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">the next rung runs its</tspan>
<tspan x="1320.0" dy="15.0">OWN entry gate against</tspan>
<tspan x="1320.0" dy="15.0">what arrived here.</tspan>
</text>
<text x="1320.0" y="1395.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#e03131" text-anchor="start" xml:space="preserve">
<tspan x="1320.0" dy="0.0">stricter than today: score corrections</tspan>
<tspan x="1320.0" dy="15.0">are currently surfaced to the human</tspan>
<tspan x="1320.0" dy="15.0">before being made. under this rule they</tspan>
<tspan x="1320.0" dy="15.0">are not — only role-unanswerable</tspan>
<tspan x="1320.0" dy="15.0">blockers reach him.</tspan>
</text>
<text x="300.0" y="1541.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#e03131" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">OPEN on this stage — the delegation half of the machinery that serves this function has never fired:</tspan>
<tspan x="300.0" dy="18.8">the score-writing call and sized builders exist as one disk-write trial (9:1 compression, tags assigned</tspan>
<tspan x="300.0" dy="18.8">correctly), not as a session that built something. The first real delegated build is the test of</tspan>
<tspan x="300.0" dy="18.8">everything on this page.</tspan>
</text>
</svg>