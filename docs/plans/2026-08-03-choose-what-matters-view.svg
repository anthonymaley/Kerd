<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1348" viewBox="260 40 1340 1348">
<rect x="260" y="40" width="1340" height="1348" fill="#ffffff"/>
<text x="300.0" y="110.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="30" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">Choose what matters next — the real backlog, on candidate axes</tspan>
</text>
<text x="300.0" y="137.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">PRODUCT rung · function 5 · a working instance, not a specification</tspan>
<tspan x="300.0" dy="18.8">the axes are a PROPOSAL. the point is to react to the picture, not to derive axes in the abstract.</tspan>
</text>
<text x="300.0" y="182.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#e03131" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">each item carries WHAT WE LOSE by not choosing it — the v0.68 rule (name the loss, or it disappears into the good news) applied to work.</tspan>
</text>
<text x="720.0" y="200.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="720.0" dy="0.0">WHAT WE WOULD LOSE BY NOT DOING IT</tspan>
</text>
<text x="620.0" y="200.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="620.0" dy="0.0">VALUE</tspan>
</text>
<rect x="320.0" y="210.0" width="1240.0" height="224.0" rx="8" fill="none" stroke="#e03131" stroke-width="1" stroke-dasharray="8 6"/>
<text x="336.0" y="234.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#e03131" text-anchor="start" xml:space="preserve">
<tspan x="336.0" dy="0.0">HIGH CONSEQUENCE — these change what is possible, or block everything else</tspan>
</text>
<rect x="336.0" y="248.0" width="270.0" height="32.0" rx="8" fill="none" stroke="#e03131" stroke-width="1"/>
<text x="471.0" y="268.5" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#e03131" text-anchor="middle" xml:space="preserve">
<tspan x="471.0" dy="0.0">CI — nothing can refuse</tspan>
</text>
<text x="620.0" y="269.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#e03131" text-anchor="start" xml:space="preserve">
<tspan x="620.0" dy="0.0">HIGH</tspan>
</text>
<text x="720.0" y="262.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#e03131" text-anchor="start" xml:space="preserve">
<tspan x="720.0" dy="0.0">every rule stays a model choosing to comply. and /loop cannot run at all</tspan>
<tspan x="720.0" dy="15.0">where nothing can refuse — so this GATES the loop, it does not just guard it.</tspan>
</text>
<rect x="336.0" y="294.0" width="270.0" height="32.0" rx="8" fill="none" stroke="#e03131" stroke-width="1"/>
<text x="471.0" y="314.5" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#e03131" text-anchor="middle" xml:space="preserve">
<tspan x="471.0" dy="0.0">Finish the requirements walk</tspan>
</text>
<text x="620.0" y="315.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#e03131" text-anchor="start" xml:space="preserve">
<tspan x="620.0" dy="0.0">HIGH</tspan>
</text>
<text x="720.0" y="308.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#e03131" text-anchor="start" xml:space="preserve">
<tspan x="720.0" dy="0.0">20 functions stay drafted; nothing downstream of them can start.</tspan>
</text>
<rect x="336.0" y="340.0" width="270.0" height="32.0" rx="8" fill="none" stroke="#e03131" stroke-width="1"/>
<text x="471.0" y="360.5" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#e03131" text-anchor="middle" xml:space="preserve">
<tspan x="471.0" dy="0.0">Run v0.66-v0.68 for real</tspan>
</text>
<text x="620.0" y="361.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#e03131" text-anchor="start" xml:space="preserve">
<tspan x="620.0" dy="0.0">MED</tspan>
</text>
<text x="720.0" y="354.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#e03131" text-anchor="start" xml:space="preserve">
<tspan x="720.0" dy="0.0">three releases stay unverified prompt text. verification, not new capability.</tspan>
</text>
<rect x="336.0" y="386.0" width="270.0" height="32.0" rx="8" fill="none" stroke="#e03131" stroke-width="1"/>
<text x="471.0" y="406.5" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#e03131" text-anchor="middle" xml:space="preserve">
<tspan x="471.0" dy="0.0">Repin leru + krutho x2 to current cache</tspan>
</text>
<text x="620.0" y="407.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#e03131" text-anchor="start" xml:space="preserve">
<tspan x="620.0" dy="0.0">LOW</tspan>
</text>
<text x="720.0" y="400.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#e03131" text-anchor="start" xml:space="preserve">
<tspan x="720.0" dy="0.0">one cache GC from breaking silently, in three repos.</tspan>
<tspan x="720.0" dy="15.0">PURE HYGIENE — high consequence, no value. under EFFORT this looked like a</tspan>
<tspan x="720.0" dy="15.0">cheap win; under VALUE it is revealed as maintenance.</tspan>
</text>
<rect x="320.0" y="450.0" width="1240.0" height="270.0" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="336.0" y="474.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="336.0" dy="0.0">MEDIUM — worth doing, none of it urgent</tspan>
</text>
<rect x="336.0" y="488.0" width="270.0" height="32.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
<text x="471.0" y="508.5" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="471.0" dy="0.0">The SPIKE — route one dead skill</tspan>
</text>
<text x="620.0" y="509.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="620.0" dy="0.0">HIGH</tspan>
</text>
<text x="720.0" y="502.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="720.0" dy="0.0">route-vs-rip stays a coin flip. HIGHEST VALUE in this band: it settles the</tspan>
<tspan x="720.0" dy="15.0">fate of four dead skills with one cheap test.</tspan>
</text>
<rect x="336.0" y="534.0" width="270.0" height="32.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
<text x="471.0" y="554.5" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="471.0" dy="0.0">Hook staleness check in tend</tspan>
</text>
<text x="620.0" y="555.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="620.0" dy="0.0">MED</tspan>
</text>
<text x="720.0" y="548.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="720.0" dy="0.0">the manual sweep only ever fixes the repo you happen to be looking at.</tspan>
</text>
<rect x="336.0" y="580.0" width="270.0" height="32.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
<text x="471.0" y="600.5" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="471.0" dy="0.0">Settle the &#x27;reachable&#x27; clause</tspan>
</text>
<text x="620.0" y="601.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="620.0" dy="0.0">HIGH</tspan>
</text>
<text x="720.0" y="594.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="720.0" dy="0.0">artifacts stay findable but not reached — today&#x27;s unsolved one, and it</tspan>
<tspan x="720.0" dy="15.0">blocks every artifact from being useful rather than merely stored.</tspan>
</text>
<rect x="336.0" y="626.0" width="270.0" height="32.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
<text x="471.0" y="646.5" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="471.0" dy="0.0">Acceptance checklists (function 1 debt)</tspan>
</text>
<text x="620.0" y="647.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="620.0" dy="0.0">MED</tspan>
</text>
<text x="720.0" y="640.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="720.0" dy="0.0">the machine key cannot check route-specific sections without them.</tspan>
</text>
<rect x="336.0" y="672.0" width="270.0" height="32.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
<text x="471.0" y="692.5" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="471.0" dy="0.0">Guard switch-in smoke test</tspan>
</text>
<text x="620.0" y="693.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="620.0" dy="0.0">MED</tspan>
</text>
<text x="720.0" y="686.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="720.0" dy="0.0">build-heavy repos flood a lean pickup with raw output.</tspan>
</text>
<rect x="320.0" y="736.0" width="1240.0" height="224.0" rx="8" fill="none" stroke="#1e1e1e" stroke-width="1"/>
<text x="336.0" y="760.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="336.0" dy="0.0">LOW — genuinely ignorable, and you can see what ignoring costs</tspan>
</text>
<rect x="336.0" y="774.0" width="270.0" height="32.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
<text x="471.0" y="794.5" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="471.0" dy="0.0">Vault commit decision</tspan>
</text>
<text x="620.0" y="795.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="620.0" dy="0.0">LOW</tspan>
</text>
<text x="720.0" y="788.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="720.0" dy="0.0">contract and behaviour keep disagreeing.</tspan>
</text>
<rect x="336.0" y="820.0" width="270.0" height="32.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
<text x="471.0" y="840.5" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="471.0" dy="0.0">CHANGELOG — revive or delete</tspan>
</text>
<text x="620.0" y="841.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="620.0" dy="0.0">LOW</tspan>
</text>
<text x="720.0" y="834.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="720.0" dy="0.0">stale at 0.14.0 while the repo is at 0.68.0.</tspan>
</text>
<rect x="336.0" y="866.0" width="270.0" height="32.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
<text x="471.0" y="886.5" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="471.0" dy="0.0">Surface model-tiered delegation</tspan>
</text>
<text x="620.0" y="887.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="620.0" dy="0.0">LOW</tspan>
</text>
<text x="720.0" y="880.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="720.0" dy="0.0">open since v0.64.0.</tspan>
</text>
<rect x="336.0" y="912.0" width="270.0" height="32.0" rx="8" fill="#e9ecef" stroke="#1e1e1e" stroke-width="1"/>
<text x="471.0" y="932.5" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">
<tspan x="471.0" dy="0.0">Kerd.md MOC version field</tspan>
</text>
<text x="620.0" y="933.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="620.0" dy="0.0">LOW</tspan>
</text>
<text x="720.0" y="926.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="720.0" dy="0.0">says 0.31.0.</tspan>
</text>
<rect x="320.0" y="1006.0" width="1240.0" height="118.0" rx="8" fill="none" stroke="#e03131" stroke-width="1" stroke-dasharray="8 6"/>
<text x="336.0" y="1032.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#e03131" text-anchor="start" xml:space="preserve">
<tspan x="336.0" dy="0.0">BLOCKED — not candidates at all. a dependency is a hard constraint, so these cannot be &#x27;next&#x27; at any consequence.</tspan>
</text>
<rect x="340.0" y="1046.0" width="300.0" height="30.0" rx="8" fill="none" stroke="#e03131" stroke-width="1"/>
<text x="490.0" y="1065.5" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#e03131" text-anchor="middle" xml:space="preserve">
<tspan x="490.0" dy="0.0">Dogfood sherpa on ~/Bree</tspan>
</text>
<text x="340.0" y="1093.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" fill="#e03131" text-anchor="start" xml:space="preserve">
<tspan x="340.0" dy="0.0">sherpa may be routed,</tspan>
<tspan x="340.0" dy="13.8">reshaped or ripped</tspan>
</text>
<rect x="740.0" y="1046.0" width="300.0" height="30.0" rx="8" fill="none" stroke="#e03131" stroke-width="1"/>
<text x="890.0" y="1065.5" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#e03131" text-anchor="middle" xml:space="preserve">
<tspan x="890.0" dy="0.0">Mode reconciliation</tspan>
</text>
<text x="740.0" y="1093.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" fill="#e03131" text-anchor="start" xml:space="preserve">
<tspan x="740.0" dy="0.0">same decision as sherpa</tspan>
</text>
<rect x="1140.0" y="1046.0" width="300.0" height="30.0" rx="8" fill="none" stroke="#e03131" stroke-width="1"/>
<text x="1290.0" y="1065.5" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#e03131" text-anchor="middle" xml:space="preserve">
<tspan x="1290.0" dy="0.0">skriv voice profile</tspan>
</text>
<text x="1140.0" y="1093.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" fill="#e03131" text-anchor="start" xml:space="preserve">
<tspan x="1140.0" dy="0.0">needs non-founder-genre</tspan>
<tspan x="1140.0" dy="13.8">samples</tspan>
</text>
<text x="300.0" y="1153.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#e03131" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">WHAT THIS PICTURE SAYS, that a ranked list did not:</tspan>
</text>
<text x="300.0" y="1179.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">· CI is HIGH on BOTH, and alone in that. it does not merely guard the work — /loop cannot run at all where</tspan>
<tspan x="300.0" dy="16.2">  nothing can refuse, so it GATES the loop. nothing else on the board unblocks a whole capability.</tspan>
<tspan x="300.0" dy="16.2">· &#x27;Repin the three repos&#x27; is HIGH CONSEQUENCE, NO VALUE — pure hygiene. under the first cut (effort x consequence)</tspan>
<tspan x="300.0" dy="16.2">  it read as a cheap win and rose. swapping effort for value demoted it correctly: it prevents harm, it adds nothing.</tspan>
<tspan x="300.0" dy="16.2">· &#x27;The SPIKE&#x27; rose for the same reason, in reverse — medium consequence, HIGH value, because one cheap test</tspan>
<tspan x="300.0" dy="16.2">  settles the fate of four dead skills. effort had hidden that entirely.</tspan>
<tspan x="300.0" dy="16.2">· the LOSS column is what makes the bottom band safe to ignore. you can see the cost of ignoring it.</tspan>
</text>
<text x="300.0" y="1310.0" font-family="Nunito,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#e03131" text-anchor="start" xml:space="preserve">
<tspan x="300.0" dy="0.0">WHY EFFORT WAS WRONG: it is an INPUT measure sitting beside an OUTCOME measure, which makes the grid incoherent —</tspan>
<tspan x="300.0" dy="17.5">and it systematically flatters cheap work. effort survives as a tiebreaker inside a cell, and as one of the five</tspan>
<tspan x="300.0" dy="17.5">slicing factors at Slice a release. it is not an axis.</tspan>
</text>
</svg>