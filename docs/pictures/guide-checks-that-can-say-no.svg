<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     role="img" aria-labelledby="gk-title gk-desc">
  <title id="gk-title">Checks that can say no</title>
  <desc id="gk-desc">A staircase of seven rungs climbing from left to right: frame, viability, scope, design, handoff, loop, acceptance. Above the top step is the end state, ready to release. Two boxes explain what does the refusing. A gate reads what is actually on disk, refuses the next rung, and names what is missing. After a push, the build turns red at the push that broke it, with the fix already named.</desc>
  <style>
    text {
      font-family: -apple-system, "SF Pro Display", "SF Pro Text", "Helvetica Neue",
                   Inter, system-ui, "Segoe UI", Roboto, sans-serif;
      font-weight: 400;
    }
    .h       { font-size: 40px; font-weight: 600; letter-spacing: -0.02em; fill: #0B1512; }
    .h-a     { font-size: 36px; font-weight: 600; letter-spacing: -0.018em; fill: #0B5E4A; }
    .row     { font-size: 32px; fill: #0B1512; }
    .sub     { font-size: 32px; fill: #4E5D58; }
    .rung    { font-size: 28px; fill: #0B1512; }
    .box     { fill: #F7F9F7; stroke: #D5DCD7; stroke-width: 2; }
    .hair    { stroke: #D5DCD7; stroke-width: 2; fill: none; }
    .spine   { stroke: #4E5D58; stroke-width: 2; fill: none; }
    .spine-a { stroke: #0B5E4A; stroke-width: 3; fill: none; }
    .dot     { fill: #F7F9F7; stroke: #0B1512; stroke-width: 3; }
    .dot-a   { fill: #0B5E4A; stroke: #0B5E4A; stroke-width: 3; }
    @media (prefers-color-scheme: dark) {
      .h { fill: #E5EBE7; } .h-a { fill: #5CC5A3; }
      .row { fill: #E5EBE7; } .sub { fill: #93A29B; } .rung { fill: #E5EBE7; }
      .box { fill: #121B17; stroke: #223029; }
      .hair { stroke: #223029; }
      .spine { stroke: #93A29B; }
      .spine-a { stroke: #5CC5A3; }
      .dot { fill: #121B17; stroke: #E5EBE7; }
      .dot-a { fill: #5CC5A3; stroke: #5CC5A3; }
    }
  </style>

  <!-- what does the refusing -->
  <rect class="box" x="80" y="72" width="520" height="208" />
  <text class="h"    x="116" y="132">The gate.</text>
  <line class="hair" x1="116" y1="156" x2="564" y2="156" />
  <text class="row"  x="116" y="198">reads what&#8217;s actually there</text>
  <text class="row"  x="116" y="234">refuses the next rung</text>
  <text class="row"  x="116" y="270">names what&#8217;s missing</text>

  <rect class="box" x="680" y="72" width="520" height="208" />
  <text class="h"    x="716" y="132">After a push.</text>
  <line class="hair" x1="716" y1="156" x2="1164" y2="156" />
  <text class="row"  x="716" y="198">the build turns red</text>
  <text class="row"  x="716" y="234">at the push that broke it</text>
  <text class="row"  x="716" y="270">with the fix already named</text>

  <!-- what the work climbs -->
  <text class="h"   x="80" y="368">Seven rungs, in order.</text>
  <text class="sub" x="80" y="412">Work enters at the lowest it has earned.</text>

  <path class="spine" d="M 80 640 H 220 V 600 H 360 V 560 H 500 V 520 H 640 V 480
                         H 780 V 440 H 920 V 400 H 1060" />
  <path class="spine-a" d="M 1060 400 V 360 H 1200" />

  <circle class="dot" cx="80"  cy="640" r="10" />
  <circle class="dot" cx="220" cy="600" r="10" />
  <circle class="dot" cx="360" cy="560" r="10" />
  <circle class="dot" cx="500" cy="520" r="10" />
  <circle class="dot" cx="640" cy="480" r="10" />
  <circle class="dot" cx="780" cy="440" r="10" />
  <circle class="dot" cx="920" cy="400" r="10" />
  <circle class="dot-a" cx="1060" cy="360" r="14" />

  <text class="rung" x="96"  y="676">Frame</text>
  <text class="rung" x="236" y="636">Viability</text>
  <text class="rung" x="376" y="596">Scope</text>
  <text class="rung" x="516" y="556">Design</text>
  <text class="rung" x="656" y="516">Handoff</text>
  <text class="rung" x="796" y="476">Loop</text>
  <text class="rung" x="936" y="436">Acceptance</text>

  <text class="h-a" x="1200" y="324" text-anchor="end">Ready to release.</text>
</svg>
