<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     role="img" aria-labelledby="interrogate-title interrogate-desc">
  <title id="interrogate-title">Sizing the risks in an idea</title>
  <desc id="interrogate-desc">An idea goes in. The first thing settled is the one assumption that would kill it, answered with the cheapest test that can decide it. Then every risk is written into a ledger with how bad it is, how likely it is, the evidence behind it and what you will do about it. You read every row back and sign it. What comes out is the risks, not the plan.</desc>
  <style>
    text {
      font-family: -apple-system, "SF Pro Display", "SF Pro Text", "Helvetica Neue",
                   Inter, system-ui, "Segoe UI", Roboto, sans-serif;
      font-weight: 400;
    }
    .h      { font-size: 40px; font-weight: 600; letter-spacing: -0.02em; fill: #0B1512; }
    .h-a    { font-size: 40px; font-weight: 600; letter-spacing: -0.02em; fill: #0B5E4A; }
    .sub-a  { font-size: 32px; fill: #0B5E4A; }
    .col    { font-size: 32px; font-weight: 600; letter-spacing: -0.014em; fill: #0B1512; }
    .sub    { font-size: 32px; fill: #4E5D58; }
    .box    { fill: #F7F9F7; stroke: #D5DCD7; stroke-width: 2; }
    .box-a  { fill: #F7F9F7; stroke: #0B5E4A; stroke-width: 3; }
    .hair   { stroke: #D5DCD7; stroke-width: 2; fill: none; }
    .text   { stroke: #4E5D58; stroke-width: 2; fill: none; }
    .line   { stroke: #4E5D58; stroke-width: 2; fill: none; }
    .head   { fill: #4E5D58; }
    @media (prefers-color-scheme: dark) {
      .h { fill: #E5EBE7; } .h-a { fill: #5CC5A3; } .sub-a { fill: #5CC5A3; }
      .col { fill: #E5EBE7; } .sub { fill: #93A29B; }
      .box { fill: #121B17; stroke: #223029; }
      .box-a { fill: #121B17; stroke: #5CC5A3; }
      .hair { stroke: #223029; }
      .text { stroke: #93A29B; }
      .line { stroke: #93A29B; }
      .head { fill: #93A29B; }
    }
  </style>
  <defs>
    <marker id="interrogate-arrow" viewBox="0 0 16 12" markerWidth="16" markerHeight="12"
            refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path class="head" d="M0 0 L16 6 L0 12 Z" />
    </marker>
  </defs>

  <!-- connectors first, so the boxes sit over them -->
  <line class="line" x1="360" y1="180" x2="460" y2="180" marker-end="url(#interrogate-arrow)" />
  <line class="line" x1="840" y1="280" x2="840" y2="344" marker-end="url(#interrogate-arrow)" />

  <!-- what goes in -->
  <rect class="box" x="80" y="100" width="280" height="160" />
  <text class="h" x="112" y="196">An idea.</text>

  <!-- the killer question, answered first -->
  <rect class="box-a" x="480" y="80" width="720" height="200" />
  <text class="h-a"   x="512" y="152">The one assumption</text>
  <text class="h-a"   x="512" y="200">that would kill it.</text>
  <text class="sub-a" x="512" y="248">Answered first, with the cheapest test.</text>

  <!-- the ledger -->
  <rect class="box" x="80" y="360" width="1120" height="240" />
  <text class="h" x="112" y="424">Every risk, sized.</text>
  <line class="hair" x1="112" y1="452" x2="1168" y2="452" />

  <text class="col" x="112" y="504">How bad</text>
  <text class="col" x="380" y="504">How likely</text>
  <text class="col" x="660" y="504">The evidence</text>
  <text class="col" x="940" y="504">What you do</text>

  <line class="text" x1="112" y1="538" x2="296" y2="538" />
  <line class="text" x1="380" y1="538" x2="556" y2="538" />
  <line class="text" x1="660" y1="538" x2="884" y2="538" />
  <line class="text" x1="940" y1="538" x2="1168" y2="538" />

  <line class="text" x1="112" y1="572" x2="248" y2="572" />
  <line class="text" x1="380" y1="572" x2="500" y2="572" />
  <line class="text" x1="660" y1="572" x2="828" y2="572" />
  <line class="text" x1="940" y1="572" x2="1104" y2="572" />

  <!-- what comes out -->
  <text class="sub" x="80"   y="664">Read back row by row, then signed.</text>
  <text class="sub" x="1200" y="664" text-anchor="end">The risks, not the plan.</text>
</svg>
