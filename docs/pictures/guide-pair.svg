<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     role="img" aria-labelledby="pair-title pair-desc">
  <title id="pair-title">Quick back and forth</title>
  <desc id="pair-desc">Two ways of working, side by side. On the left, one long written report: it works on its own for a while and tells you everything at the end. On the right, short turns that go back and forth, with the reasoning kept out of the way and one question asked at a time, the moment it matters.</desc>
  <style>
    text {
      font-family: -apple-system, "SF Pro Display", "SF Pro Text", "Helvetica Neue",
                   Inter, system-ui, "Segoe UI", Roboto, sans-serif;
      font-weight: 400;
    }
    .h      { font-size: 40px; font-weight: 600; letter-spacing: -0.02em; fill: #0B1512; }
    .h-a    { font-size: 40px; font-weight: 600; letter-spacing: -0.02em; fill: #0B5E4A; }
    .sub    { font-size: 32px; fill: #4E5D58; }
    .box    { fill: #F7F9F7; stroke: #D5DCD7; stroke-width: 2; }
    .box-a  { fill: #F7F9F7; stroke: #0B5E4A; stroke-width: 3; }
    .hair   { stroke: #D5DCD7; stroke-width: 2; fill: none; }
    .text   { stroke: #4E5D58; stroke-width: 2; fill: none; }
    .line   { stroke: #4E5D58; stroke-width: 2; fill: none; }
    .head   { fill: #4E5D58; }
    @media (prefers-color-scheme: dark) {
      .h { fill: #E5EBE7; } .h-a { fill: #5CC5A3; } .sub { fill: #93A29B; }
      .box { fill: #121B17; stroke: #223029; }
      .box-a { fill: #121B17; stroke: #5CC5A3; }
      .hair { stroke: #223029; }
      .text { stroke: #93A29B; }
      .line { stroke: #93A29B; }
      .head { fill: #93A29B; }
    }
  </style>
  <defs>
    <marker id="pair-arrow" viewBox="0 0 16 12" markerWidth="16" markerHeight="12"
            refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path class="head" d="M0 0 L16 6 L0 12 Z" />
    </marker>
  </defs>

  <!-- the seam between the two ways of working -->
  <line class="hair" x1="600" y1="120" x2="600" y2="680" />

  <!-- left: one long report -->
  <text class="h"   x="80" y="152">A long report.</text>
  <text class="sub" x="80" y="200">It works a while, then tells you.</text>

  <rect class="box" x="80" y="240" width="440" height="320" />
  <line class="text" x1="112" y1="296" x2="488" y2="296" />
  <line class="text" x1="112" y1="332" x2="440" y2="332" />
  <line class="text" x1="112" y1="368" x2="472" y2="368" />
  <line class="text" x1="112" y1="404" x2="408" y2="404" />
  <line class="text" x1="112" y1="440" x2="480" y2="440" />
  <line class="text" x1="112" y1="476" x2="424" y2="476" />
  <line class="text" x1="112" y1="512" x2="376" y2="512" />

  <text class="sub" x="80" y="624">All of it at the end.</text>

  <!-- right: short turns -->
  <text class="h"   x="680" y="152">Short turns.</text>
  <text class="sub" x="680" y="200">It checks in early.</text>

  <path class="line" d="M 780 296 V 332 A 8 8 0 0 0 788 340 H 1000"
        marker-end="url(#pair-arrow)" />
  <path class="line" d="M 1100 376 V 412 A 8 8 0 0 1 1092 420 H 880"
        marker-end="url(#pair-arrow)" />
  <line class="line" x1="780" y1="456" x2="780" y2="472" marker-end="url(#pair-arrow)" />

  <rect class="box" x="680" y="240" width="200" height="56" />
  <line class="hair" x1="704" y1="260" x2="848" y2="260" />
  <line class="hair" x1="704" y1="280" x2="792" y2="280" />

  <rect class="box" x="1000" y="320" width="200" height="56" />
  <line class="hair" x1="1024" y1="340" x2="1168" y2="340" />
  <line class="hair" x1="1024" y1="360" x2="1112" y2="360" />

  <rect class="box" x="680" y="400" width="200" height="56" />
  <line class="hair" x1="704" y1="420" x2="848" y2="420" />
  <line class="hair" x1="704" y1="440" x2="792" y2="440" />

  <!-- the one question -->
  <rect class="box-a" x="680" y="480" width="520" height="120" />
  <text class="h-a" x="712" y="552">One question at a time.</text>

  <text class="sub" x="680" y="656">Then it is your turn.</text>
</svg>
