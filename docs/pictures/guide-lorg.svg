<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     role="img" aria-labelledby="lorg-title lorg-desc">
  <title id="lorg-title">Finding what would help</title>
  <desc id="lorg-desc">What your project already shows — what it is built with, what your notes keep saying, what you worked on recently — is matched against three widening circles of tools: the ones already on your machine but going unused, then the marketplace, then the wider web. Each match has to point back at a real signal from your project, and nothing is installed until you say yes, one at a time.</desc>
  <style>
    text {
      font-family: -apple-system, "SF Pro Display", "SF Pro Text", "Helvetica Neue",
                   Inter, system-ui, "Segoe UI", Roboto, sans-serif;
      font-weight: 400;
    }
    .h      { font-size: 40px; font-weight: 600; letter-spacing: -0.02em; fill: #0B1512; }
    .h-a    { font-size: 40px; font-weight: 600; letter-spacing: -0.02em; fill: #0B5E4A; }
    .name   { font-size: 36px; font-weight: 600; letter-spacing: -0.018em; fill: #0B1512; }
    .row    { font-size: 32px; fill: #0B1512; }
    .sub    { font-size: 32px; fill: #4E5D58; }
    .box    { fill: #F7F9F7; stroke: #D5DCD7; stroke-width: 2; }
    .box-a  { fill: #F7F9F7; stroke: #0B5E4A; stroke-width: 3; }
    .ring   { fill: none; stroke: #D5DCD7; stroke-width: 2; }
    .line   { stroke: #4E5D58; stroke-width: 2; fill: none; }
    .head   { fill: #4E5D58; }
    @media (prefers-color-scheme: dark) {
      .h { fill: #E5EBE7; } .h-a { fill: #5CC5A3; } .name { fill: #E5EBE7; }
      .row { fill: #E5EBE7; } .sub { fill: #93A29B; }
      .box { fill: #121B17; stroke: #223029; }
      .box-a { fill: #121B17; stroke: #5CC5A3; }
      .ring { stroke: #223029; }
      .line { stroke: #93A29B; }
      .head { fill: #93A29B; }
    }
  </style>
  <defs>
    <marker id="lorg-arrow" viewBox="0 0 16 12" markerWidth="16" markerHeight="12"
            refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path class="head" d="M0 0 L16 6 L0 12 Z" />
    </marker>
  </defs>

  <!-- what your project already shows -->
  <rect class="box" x="80" y="140" width="440" height="280" />
  <text class="h" x="112" y="204">Your project.</text>
  <line class="ring" x1="112" y1="236" x2="488" y2="236" />
  <text class="row" x="112" y="296">what it is built with</text>
  <text class="row" x="112" y="344">what your notes say</text>
  <text class="row" x="112" y="392">what you did last week</text>

  <line class="line" x1="520" y1="280" x2="620" y2="280" marker-end="url(#lorg-arrow)" />

  <!-- three widening circles -->
  <rect class="ring" x="640" y="80" width="560" height="400" />
  <text class="sub" x="672" y="132">The wider web.</text>

  <rect class="ring" x="680" y="140" width="480" height="280" />
  <text class="sub" x="712" y="192">The marketplace.</text>

  <rect class="box" x="720" y="200" width="400" height="160" />
  <text class="name" x="920" y="268" text-anchor="middle">Already here,</text>
  <text class="name" x="920" y="312" text-anchor="middle">going unused.</text>

  <line class="line" x1="920" y1="480" x2="920" y2="552" marker-end="url(#lorg-arrow)" />

  <!-- the gate -->
  <rect class="box-a" x="560" y="560" width="640" height="120" />
  <text class="h-a" x="592" y="632">You say yes, one at a time.</text>
</svg>
