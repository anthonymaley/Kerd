name: entry-gate
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skill unit tests
        run: python3 tools/run_tests.py
      - name: Hook tests
        run: bash tests/hooks_test.sh
      - name: Release rules
        run: python3 tools/release_check.py
